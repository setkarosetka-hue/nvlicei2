<!DOCTYPE html><html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Домашні завдання — Ліцей №2</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="app.js" defer></script>

<style>
    .homework-page {
        width: min(1100px, calc(100% - 24px));
        margin: auto;
        padding: 20px 0 40px;
    }

    .homework-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 20px;
        margin-bottom: 18px;
        border-radius: 22px;
        background: rgba(255,255,255,.07);
        border: 1px solid rgba(255,255,255,.1);
    }

    .homework-header h1 {
        margin: 0 0 5px;
    }

    .homework-header p {
        margin: 0;
        opacity: .65;
    }

    .back-btn {
        padding: 10px 15px;
        border-radius: 13px;
        text-decoration: none;
        color: inherit;
        background: rgba(255,255,255,.09);
        border: 1px solid rgba(255,255,255,.1);
        white-space: nowrap;
    }

    .filters {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 17px;
    }

    .filter-btn {
        border: 1px solid rgba(255,255,255,.1);
        background: rgba(255,255,255,.06);
        color: inherit;
        border-radius: 12px;
        padding: 9px 13px;
        cursor: pointer;
    }

    .filter-btn.active {
        background: rgba(0,170,255,.18);
        border-color: rgba(0,170,255,.3);
    }

    .homework-status {
        padding: 14px 17px;
        margin-bottom: 16px;
        border-radius: 16px;
        background: rgba(255,255,255,.06);
        border: 1px solid rgba(255,255,255,.08);
    }

    .homework-list {
        display: grid;
        gap: 14px;
    }

    .homework-card {
        padding: 21px;
        border-radius: 21px;
        background: rgba(255,255,255,.065);
        border: 1px solid rgba(255,255,255,.09);
    }

    .homework-card.overdue {
        border-color: rgba(255,90,90,.3);
    }

    .homework-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 14px;
    }

    .homework-card h2 {
        margin: 0 0 8px;
        font-size: 20px;
    }

    .subject {
        display: inline-block;
        padding: 6px 10px;
        border-radius: 10px;
        background: rgba(0,170,255,.13);
        font-size: 12px;
    }

    .homework-description {
        margin: 15px 0 0;
        line-height: 1.6;
        opacity: .8;
        white-space: pre-wrap;
    }

    .homework-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 16px;
    }

    .meta {
        padding: 7px 10px;
        border-radius: 10px;
        background: rgba(255,255,255,.06);
        font-size: 12px;
        opacity: .75;
    }

    .overdue-label {
        padding: 7px 10px;
        border-radius: 10px;
        background: rgba(255,70,70,.13);
        font-size: 12px;
    }

    .empty {
        padding: 42px 20px;
        text-align: center;
        border-radius: 20px;
        background: rgba(255,255,255,.05);
        border: 1px dashed rgba(255,255,255,.12);
    }

    .empty-icon {
        font-size: 42px;
        margin-bottom: 10px;
    }

    .empty p {
        margin: 0;
        opacity: .65;
    }

    .error {
        color: #ffb4b4;
    }

    @media (max-width: 600px) {
        .homework-page {
            width: min(100% - 16px, 1100px);
        }

        .homework-header {
            padding: 16px;
        }

        .homework-header h1 {
            font-size: 24px;
        }

        .back-btn {
            padding: 9px 11px;
            font-size: 13px;
        }

        .homework-card {
            padding: 17px;
        }

        .homework-top {
            flex-direction: column;
        }
    }
</style>

</head><body><main class="homework-page"><header class="homework-header">
    <div>
        <h1>📚 Домашні завдання</h1>
        <p>Завдання та терміни виконання</p>
    </div>

    <a href="dashboard.html" class="back-btn">
        🏠 Головна
    </a>
</header>

<div class="filters">
    <button class="filter-btn active" data-filter="all">
        Усі
    </button>

    <button class="filter-btn" data-filter="active">
        Актуальні
    </button>

    <button class="filter-btn" data-filter="overdue">
        Прострочені
    </button>
</div>

<div id="homeworkStatus" class="homework-status">
    Завантаження домашніх завдань...
</div>

<section id="homeworkList" class="homework-list"></section>

</main><script>
document.addEventListener("DOMContentLoaded", async () => {

    const status = document.getElementById("homeworkStatus");
    const list = document.getElementById("homeworkList");
    const filterButtons = document.querySelectorAll(".filter-btn");

    let allHomework = [];
    let currentFilter = "all";

    function escapeHTML(value) {
        if (value === null || value === undefined) return "";

        return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }

    function getToday() {
        const now = new Date();

        return new Date(
            now.getFullYear(),
            now.getMonth(),
            now.getDate()
        );
    }

    function isOverdue(item) {

        if (!item.due_date) {
            return false;
        }

        const due = new Date(item.due_date + "T23:59:59");

        return due < new Date();
    }

    function formatDate(value) {

        if (!value) {
            return "Термін не вказано";
        }

        const date = new Date(value);

        if (Number.isNaN(date.getTime())) {
            return escapeHTML(value);
        }

        return date.toLocaleDateString("uk-UA", {
            day: "2-digit",
            month: "long",
            year: "numeric"
        });
    }

    function renderHomework() {

        let filtered = [...allHomework];

        if (currentFilter === "active") {
            filtered = filtered.filter(item => !isOverdue(item));
        }

        if (currentFilter === "overdue") {
            filtered = filtered.filter(item => isOverdue(item));
        }

        if (filtered.length === 0) {

            status.textContent =
                "За вибраним фільтром завдань немає.";

            list.innerHTML = `
                <div class="empty">
                    <div class="empty-icon">📚</div>
                    <p>Домашніх завдань у цій категорії немає.</p>
                </div>
            `;

            return;
        }

        status.textContent =
            `Завдань: ${filtered.length}`;

        list.innerHTML = filtered.map(item => {

            const overdue = isOverdue(item);

            const title =
                escapeHTML(item.title || "Домашнє завдання");

            const subject =
                escapeHTML(item.subject || "Предмет не вказано");

            const description =
                escapeHTML(
                    item.description ||
                    "Опис завдання відсутній."
                );

            const className =
                item.class_name
                    ? `👥 ${escapeHTML(item.class_name)}`
                    : "";

            const date =
                item.due_date
                    ? `📅 До ${formatDate(item.due_date)}`
                    : "📅 Термін не вказано";

            return `
                <article class="homework-card ${overdue ? "overdue" : ""}">

                    <div class="homework-top">

                        <div>
                            <h2>${title}</h2>

                            <span class="subject">
                                ${subject}
                            </span>
                        </div>

                        ${
                            overdue
                                ? `<span class="overdue-label">⚠ Прострочено</span>`
                                : ""
                        }

                    </div>

                    <div class="homework-description">
                        ${description}
                    </div>

                    <div class="homework-meta">

                        <span class="meta">
                            ${date}
                        </span>

                        ${
                            className
                                ? `<span class="meta">${className}</span>`
                                : ""
                        }

                    </div>

                </article>
            `;

        }).join("");
    }

    filterButtons.forEach(button => {

        button.addEventListener("click", () => {

            filterButtons.forEach(item =>
                item.classList.remove("active")
            );

            button.classList.add("active");

            currentFilter =
                button.dataset.filter || "all";

            renderHomework();
        });

    });

    try {

        if (!window.supabaseClient) {

            status.innerHTML =
                '<span class="error">Не вдалося підключити Supabase. Перевір supabase.js.</span>';

            return;
        }

        const {
            data: homework,
            error
        } = await window.supabaseClient
            .from("homework")
            .select("*")
            .order("due_date", {
                ascending: true,
                nullsFirst: false
            });

        if (error) {

            console.error("Supabase homework error:", error);

            status.innerHTML =
                '<span class="error">Не вдалося завантажити домашні завдання. Перевір таблицю homework та RLS.</span>';

            list.innerHTML = `
                <div class="empty">
                    <div class="empty-icon">⚠️</div>
                    <p>Supabase повернув помилку під час отримання домашніх завдань.</p>
                </div>
            `;

            return;
        }

        allHomework = homework || [];

        renderHomework();

    } catch (error) {

        console.error("Homework loading error:", error);

        status.innerHTML =
            '<span class="error">Помилка під час завантаження домашніх завдань.</span>';
    }

});
</script></body>
</html>
