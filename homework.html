<!DOCTYPE html><html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#07111f"><title>Домашні завдання — Ліцей №2</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="app.js" defer></script>

</head><body><header class="site-header">
    <div class="container header-inner">    <a href="dashboard.html" class="brand">
        <span class="brand-mark">Л2</span>

        <span class="brand-text">
            <strong>Ліцей №2</strong>
            <small>Домашні завдання</small>
        </span>
    </a>

    <button
        type="button"
        class="mobile-menu-button"
        id="mobileMenuButton"
        aria-label="Відкрити меню"
        aria-expanded="false">
        ☰
    </button>

    <nav class="main-nav" id="mainNav">
        <a href="dashboard.html">Кабінет</a>
        <a href="schedule.html">Розклад</a>
        <a href="homework.html" class="active">Домашні завдання</a>
        <a href="messages.html">Повідомлення</a>
    </nav>

</div>

</header><main class="container page-content"><section class="page-hero">
    <div>
        <span class="eyebrow">Навчання</span>
        <h1>Домашні завдання</h1>
        <p>Переглядай завдання та терміни виконання.</p>
    </div>
</section>

<section class="filters">

    <button type="button" class="filter-button active" data-filter="all">
        Усі
    </button>

    <button type="button" class="filter-button" data-filter="active">
        Поточні
    </button>

    <button type="button" class="filter-button" data-filter="overdue">
        Прострочені
    </button>

</section>

<section id="homeworkStatus" class="status-box">
    Завантаження домашніх завдань...
</section>

<section id="homeworkList" class="homework-list"></section>

</main><footer class="site-footer">
    <div class="container">
        <p>© <span id="currentYear"></span> Ліцей №2</p>
    </div>
</footer><style>
    .page-content {
        padding-top: 28px;
        padding-bottom: 48px;
    }

    .page-hero {
        margin-bottom: 20px;
        padding: 26px;
        border: 1px solid var(--border-color);
        border-radius: 22px;
        background:
            radial-gradient(circle at top right, rgba(70, 130, 255, .18), transparent 35%),
            var(--surface-color);
    }

    .page-hero h1 {
        margin: 6px 0 8px;
        font-size: clamp(27px, 5vw, 38px);
    }

    .page-hero p {
        margin: 0;
        color: var(--muted-text);
    }

    .eyebrow {
        color: var(--primary-color);
        font-size: 13px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: .08em;
    }

    .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 18px;
    }

    .filter-button {
        min-height: 42px;
        padding: 9px 15px;
        border: 1px solid var(--border-color);
        border-radius: 12px;
        background: var(--surface-color);
        color: var(--text-color);
        cursor: pointer;
        font-weight: 650;
    }

    .filter-button.active,
    .filter-button:hover {
        border-color: rgba(100, 150, 255, .55);
        background: rgba(70, 130, 255, .13);
    }

    .status-box {
        padding: 18px;
        margin-bottom: 14px;
        border: 1px solid var(--border-color);
        border-radius: 16px;
        background: var(--surface-color);
        color: var(--muted-text);
        text-align: center;
    }

    .error-state {
        color: #ff9d9d;
        border-color: rgba(255, 90, 90, .35);
    }

    .homework-list {
        display: grid;
        gap: 13px;
    }

    .homework-card {
        padding: 19px;
        border: 1px solid var(--border-color);
        border-radius: 19px;
        background: var(--surface-color);
    }

    .homework-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 14px;
    }

    .homework-subject {
        color: var(--primary-color);
        font-size: 13px;
        font-weight: 750;
        text-transform: uppercase;
        letter-spacing: .04em;
    }

    .homework-title {
        margin-top: 5px;
        font-size: 19px;
        font-weight: 750;
        overflow-wrap: anywhere;
    }

    .homework-description {
        margin-top: 10px;
        color: var(--muted-text);
        line-height: 1.55;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
    }

    .homework-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        margin-top: 15px;
    }

    .homework-meta span {
        padding: 6px 9px;
        border-radius: 9px;
        background: rgba(255,255,255,.05);
        color: var(--muted-text);
        font-size: 12px;
    }

    .due-date {
        flex: 0 0 auto;
        padding: 7px 9px;
        border-radius: 9px;
        background: rgba(70, 130, 255, .12);
        color: var(--text-color);
        font-size: 12px;
        white-space: nowrap;
    }

    .due-date.overdue {
        background: rgba(255, 70, 70, .12);
        color: #ff9d9d;
    }

    .empty-state {
        padding: 32px 18px;
        border: 1px dashed var(--border-color);
        border-radius: 18px;
        color: var(--muted-text);
        text-align: center;
    }

    @media (max-width: 600px) {
        .page-content {
            padding-top: 18px;
        }

        .page-hero {
            padding: 21px 17px;
            border-radius: 19px;
        }

        .homework-card {
            padding: 16px;
            border-radius: 17px;
        }

        .homework-top {
            flex-direction: column;
        }

        .due-date {
            white-space: normal;
        }

        .filters {
            overflow-x: auto;
            flex-wrap: nowrap;
            padding-bottom: 3px;
        }

        .filter-button {
            flex: 0 0 auto;
        }
    }
</style><script>
(function () {
    "use strict";

    let allHomework = [];
    let currentFilter = "all";

    const statusElement = document.getElementById("homeworkStatus");
    const listElement = document.getElementById("homeworkList");

    function escapeHtml(value) {
        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function showStatus(message, isError) {
        statusElement.textContent = message;
        statusElement.classList.toggle("error-state", Boolean(isError));
        statusElement.style.display = "block";
    }

    function parseDate(value) {
        if (!value) return null;

        const date = new Date(value);

        if (Number.isNaN(date.getTime())) {
            return null;
        }

        return date;
    }

    function isOverdue(item) {
        const dueDate = parseDate(item.due_date);

        if (!dueDate) {
            return false;
        }

        const today = new Date();
        today.setHours(23, 59, 59, 999);

        return dueDate < today;
    }

    function formatDate(value) {
        const date = parseDate(value);

        if (!date) {
            return "Дата не вказана";
        }

        return date.toLocaleDateString("uk-UA", {
            day: "2-digit",
            month: "2-digit",
            year: "numeric"
        });
    }

    function renderHomework() {
        let filtered = [...allHomework];

        if (currentFilter === "active") {
            filtered = filtered.filter(item => !isOverdue(item));
        }

        if (currentFilter === "overdue") {
            filtered = filtered.filter(item => isOverdue(item));
        }

        filtered.sort((a, b) => {
            const dateA = parseDate(a.due_date)?.getTime() || Infinity;
            const dateB = parseDate(b.due_date)?.getTime() || Infinity;

            return dateA - dateB;
        });

        listElement.innerHTML = "";

        if (!filtered.length) {
            statusElement.style.display = "none";

            listElement.innerHTML = `
                <div class="empty-state">
                    📭 Домашніх завдань за вибраним фільтром немає.
                </div>
            `;

            return;
        }

        statusElement.style.display = "none";

        filtered.forEach(item => {
            const overdue = isOverdue(item);

            const card = document.createElement("article");
            card.className = "homework-card";

            const subject = escapeHtml(item.subject || "Предмет");
            const title = escapeHtml(item.title || "Домашнє завдання");
            const description = escapeHtml(
                item.description || "Опис завдання відсутній."
            );

            const className = item.class_name
                ? `<span>👥 ${escapeHtml(item.class_name)}</span>`
                : "";

            const teacher = item.teacher_id
                ? `<span>👨‍🏫 Учитель</span>`
                : "";

            const dateText = formatDate(item.due_date);

            card.innerHTML = `
                <div class="homework-top">
                    <div>
                        <div class="homework-subject">${subject}</div>
                        <div class="homework-title">${title}</div>
                    </div>

                    <div class="due-date ${overdue ? "overdue" : ""}">
                        ${overdue ? "⚠️ " : "📅 "}
                        ${dateText}
                    </div>
                </div>

                <div class="homework-description">
                    ${description}
                </div>

                <div class="homework-meta">
                    ${className}
                    ${teacher}
                </div>
            `;

            listElement.appendChild(card);
        });
    }

    async function loadHomework() {
        listElement.innerHTML = "";

        if (
            typeof window.supabaseClient === "undefined" ||
            !window.supabaseClient
        ) {
            showStatus(
                "Не вдалося підключити Supabase. Перевір файл supabase.js.",
                true
            );
            return;
        }

        showStatus("Завантаження домашніх завдань...", false);

        try {
            const { data, error } = await window.supabaseClient
                .from("homework")
                .select("*")
                .order("due_date", { ascending: true });

            if (error) {
                console.error("Homework Supabase error:", error);

                showStatus(
                    "Не вдалося завантажити домашні завдання. Перевір таблицю homework та RLS-політики у Supabase.",
                    true
                );

                listElement.innerHTML = `
                    <div class="empty-state error-state">
                        ⚠️ Не вдалося отримати дані з таблиці homework.
                    </div>
                `;

                return;
            }

            allHomework = Array.isArray(data) ? data : [];

            renderHomework();

        } catch (error) {
            console.error("Homework loading error:", error);

            showStatus(
                "Сталася помилка під час завантаження домашніх завдань.",
                true
            );
        }
    }

    document.querySelectorAll(".filter-button").forEach(button => {
        button.addEventListener("click", function () {
            currentFilter = this.dataset.filter || "all";

            document.querySelectorAll(".filter-button").forEach(item => {
                item.classList.toggle("active", item === this);
            });

            renderHomework();
        });
    });

    document.addEventListener("DOMContentLoaded", function () {
        loadHomework();
    });

    if (document.readyState !== "loading") {
        loadHomework();
    }
})();
</script></body>
</html>
