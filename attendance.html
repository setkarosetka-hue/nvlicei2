<!DOCTYPE html><html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#07111f"><title>Відвідуваність — Ліцей №2</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="app.js" defer></script>

</head><body><header class="site-header">
    <div class="container header-inner">    <a href="dashboard.html" class="brand">
        <span class="brand-mark">Л2</span>

        <span class="brand-text">
            <strong>Ліцей №2</strong>
            <small>Відвідуваність</small>
        </span>
    </a>

    <button
        type="button"
        class="mobile-menu-button"
        id="mobileMenuButton"
        aria-label="Відкрити меню"
        aria-expanded="false">
        ☰
    </button>

    <nav class="main-nav" id="mainNav">
        <a href="dashboard.html">Кабінет</a>
        <a href="schedule.html">Розклад</a>
        <a href="homework.html">Домашні завдання</a>
        <a href="attendance.html" class="active">Відвідуваність</a>
    </nav>

</div>

</header><main class="container page-content"><section class="page-hero">
    <div>
        <span class="eyebrow">Навчання</span>
        <h1>Відвідуваність</h1>
        <p>Інформація про присутність, запізнення та відсутність.</p>
    </div>
</section>

<section class="attendance-summary">

    <div class="summary-card">
        <span class="summary-icon">✅</span>
        <strong id="presentCount">0</strong>
        <small>Присутній</small>
    </div>

    <div class="summary-card">
        <span class="summary-icon">⏰</span>
        <strong id="lateCount">0</strong>
        <small>Запізнення</small>
    </div>

    <div class="summary-card">
        <span class="summary-icon">❌</span>
        <strong id="absentCount">0</strong>
        <small>Відсутній</small>
    </div>

</section>

<section id="attendanceStatus" class="status-box">
    Завантаження відвідуваності...
</section>

<section id="attendanceList" class="attendance-list"></section>

</main><footer class="site-footer">
    <div class="container">
        <p>© <span id="currentYear"></span> Ліцей №2</p>
    </div>
</footer><style>
    .page-content {
        padding-top: 28px;
        padding-bottom: 48px;
    }

    .page-hero {
        margin-bottom: 20px;
        padding: 26px;
        border: 1px solid var(--border-color);
        border-radius: 22px;
        background:
            radial-gradient(circle at top right, rgba(70, 130, 255, .18), transparent 35%),
            var(--surface-color);
    }

    .page-hero h1 {
        margin: 6px 0 8px;
        font-size: clamp(27px, 5vw, 38px);
    }

    .page-hero p {
        margin: 0;
        color: var(--muted-text);
    }

    .eyebrow {
        color: var(--primary-color);
        font-size: 13px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: .08em;
    }

    .attendance-summary {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        margin-bottom: 18px;
    }

    .summary-card {
        min-width: 0;
        padding: 17px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        border: 1px solid var(--border-color);
        border-radius: 18px;
        background: var(--surface-color);
    }

    .summary-icon {
        font-size: 24px;
        margin-bottom: 7px;
    }

    .summary-card strong {
        font-size: 25px;
    }

    .summary-card small {
        margin-top: 3px;
        color: var(--muted-text);
        font-size: 12px;
    }

    .status-box {
        padding: 18px;
        margin-bottom: 14px;
        border: 1px solid var(--border-color);
        border-radius: 16px;
        background: var(--surface-color);
        color: var(--muted-text);
        text-align: center;
    }

    .status-box.error-state {
        color: #ff9d9d;
        border-color: rgba(255, 90, 90, .35);
    }

    .attendance-list {
        display: grid;
        gap: 12px;
    }

    .attendance-card {
        display: grid;
        grid-template-columns: 52px minmax(0, 1fr) auto;
        align-items: center;
        gap: 14px;
        padding: 16px;
        border: 1px solid var(--border-color);
        border-radius: 18px;
        background: var(--surface-color);
    }

    .attendance-icon {
        width: 48px;
        height: 48px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 14px;
        background: rgba(255,255,255,.05);
        font-size: 22px;
    }

    .attendance-main {
        min-width: 0;
    }

    .attendance-date {
        font-weight: 750;
    }

    .attendance-details {
        margin-top: 5px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        color: var(--muted-text);
        font-size: 13px;
    }

    .attendance-details span {
        padding: 4px 7px;
        border-radius: 7px;
        background: rgba(255,255,255,.04);
    }

    .attendance-status {
        padding: 7px 10px;
        border-radius: 9px;
        font-size: 12px;
        font-weight: 700;
        white-space: nowrap;
    }

    .status-present {
        background: rgba(60, 200, 120, .12);
    }

    .status-late {
        background: rgba(255, 180, 50, .13);
    }

    .status-absent {
        background: rgba(255, 70, 70, .12);
        color: #ff9d9d;
    }

    .empty-state {
        padding: 34px 18px;
        border: 1px dashed var(--border-color);
        border-radius: 18px;
        color: var(--muted-text);
        text-align: center;
    }

    .error-state {
        color: #ff9d9d;
    }

    @media (max-width: 650px) {
        .page-content {
            padding-top: 18px;
        }

        .page-hero {
            padding: 21px 17px;
            border-radius: 19px;
        }

        .attendance-summary {
            gap: 7px;
        }

        .summary-card {
            padding: 13px 7px;
            border-radius: 15px;
        }

        .summary-icon {
            font-size: 20px;
        }

        .summary-card strong {
            font-size: 21px;
        }

        .attendance-card {
            grid-template-columns: 44px minmax(0, 1fr);
            gap: 11px;
        }

        .attendance-icon {
            width: 42px;
            height: 42px;
            border-radius: 12px;
        }

        .attendance-status {
            grid-column: 2;
            justify-self: start;
        }
    }
</style><script>
(function () {
    "use strict";

    let attendanceData = [];

    const statusElement = document.getElementById("attendanceStatus");
    const listElement = document.getElementById("attendanceList");

    function escapeHtml(value) {
        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function showStatus(message, isError) {
        statusElement.textContent = message;
        statusElement.classList.toggle("error-state", Boolean(isError));
        statusElement.style.display = "block";
    }

    function formatDate(value) {
        if (!value) return "Дата не вказана";

        const date = new Date(value);

        if (Number.isNaN(date.getTime())) {
            return "Дата не вказана";
        }

        return date.toLocaleDateString("uk-UA", {
            day: "2-digit",
            month: "long",
            year: "numeric"
        });
    }

    function getStatus(value) {
        const status = String(value || "").toLowerCase().trim();

        if (
            status === "late" ||
            status === "запізнився" ||
            status === "запізнення"
        ) {
            return {
                text: "Запізнення",
                icon: "⏰",
                className: "status-late"
            };
        }

        if (
            status === "absent" ||
            status === "відсутній" ||
            status === "відсутня"
        ) {
            return {
                text: "Відсутній",
                icon: "❌",
                className: "status-absent"
            };
        }

        return {
            text: "Присутній",
            icon: "✅",
            className: "status-present"
        };
    }

    function updateSummary() {
        let present = 0;
        let late = 0;
        let absent = 0;

        attendanceData.forEach(item => {
            const status = String(item.status || "").toLowerCase().trim();

            if (
                status === "late" ||
                status === "запізнився" ||
                status === "запізнення"
            ) {
                late++;
            } else if (
                status === "absent" ||
                status === "відсутній" ||
                status === "відсутня"
            ) {
                absent++;
            } else {
                present++;
            }
        });

        document.getElementById("presentCount").textContent = present;
        document.getElementById("lateCount").textContent = late;
        document.getElementById("absentCount").textContent = absent;
    }

    function renderAttendance() {
        listElement.innerHTML = "";

        if (!attendanceData.length) {
            statusElement.style.display = "none";

            listElement.innerHTML = `
                <div class="empty-state">
                    📭 Даних про відвідуваність поки немає.
                </div>
            `;

            return;
        }

        statusElement.style.display = "none";

        attendanceData.forEach(item => {
            const status = getStatus(item.status);

            const card = document.createElement("article");
            card.className = "attendance-card";

            const lateMinutes = Number(item.late_minutes || 0);

            const lateText =
                status.text === "Запізнення" && lateMinutes > 0
                    ? `<span>⏱ ${lateMinutes} хв.</span>`
                    : "";

            const classText = item.class_name
                ? `<span>👥 ${escapeHtml(item.class_name)}</span>`
                : "";

            const reasonText = item.reason
                ? `<span>💬 ${escapeHtml(item.reason)}</span>`
                : "";

            card.innerHTML = `
                <div class="attendance-icon">
                    ${status.icon}
                </div>

                <div class="attendance-main">
                    <div class="attendance-date">
                        ${escapeHtml(formatDate(item.attendance_date))}
                    </div>

                    <div class="attendance-details">
                        ${classText}
                        ${lateText}
                        ${reasonText}
                    </div>
                </div>

                <div class="attendance-status ${status.className}">
                    ${escapeHtml(status.text)}
                </div>
            `;

            listElement.appendChild(card);
        });
    }

    async function loadAttendance() {
        listElement.innerHTML = "";

        if (
            typeof window.supabaseClient === "undefined" ||
            !window.supabaseClient
        ) {
            showStatus(
                "Не вдалося підключити Supabase. Перевір файл supabase.js.",
                true
            );
            return;
        }

        showStatus("Завантаження відвідуваності...", false);

        try {
            const { data: userData, error: userError } =
                await window.supabaseClient.auth.getUser();

            if (userError || !userData || !userData.user) {
                showStatus(
                    "Не вдалося визначити поточного користувача.",
                    true
                );
                return;
            }

            const userId = userData.user.id;

            const { data, error } = await window.supabaseClient
                .from("attendance")
                .select("*")
                .eq("student_id", userId)
                .order("attendance_date", { ascending: false });

            if (error) {
                console.error("Attendance Supabase error:", error);

                showStatus(
                    "Не вдалося завантажити відвідування. Перевір таблицю attendance у Supabase та права доступу.",
                    true
                );

                listElement.innerHTML = `
                    <div class="empty-state error-state">
                        ⚠️ Supabase не дозволив отримати дані з таблиці attendance.
                    </div>
                `;

                return;
            }

            attendanceData = Array.isArray(data) ? data : [];

            updateSummary();
            renderAttendance();

        } catch (error) {
            console.error("Attendance loading error:", error);

            showStatus(
                "Сталася помилка під час завантаження відвідуваності.",
                true
            );
        }
    }

    document.addEventListener("DOMContentLoaded", function () {
        loadAttendance();
    });

    if (document.readyState !== "loading") {
        loadAttendance();
    }
})();
</script></body>
</html>
