<!DOCTYPE html><html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Відвідування — Ліцей №2</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="app.js" defer></script>

<style>
    .attendance-page {
        width: min(1100px, calc(100% - 24px));
        margin: auto;
        padding: 20px 0 40px;
    }

    .attendance-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 20px;
        margin-bottom: 18px;
        border-radius: 22px;
        background: rgba(255,255,255,.07);
        border: 1px solid rgba(255,255,255,.1);
    }

    .attendance-header h1 {
        margin: 0 0 5px;
    }

    .attendance-header p {
        margin: 0;
        opacity: .65;
    }

    .back-btn {
        padding: 10px 15px;
        border-radius: 13px;
        text-decoration: none;
        color: inherit;
        background: rgba(255,255,255,.09);
        border: 1px solid rgba(255,255,255,.1);
        white-space: nowrap;
    }

    .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin-bottom: 20px;
    }

    .stat {
        padding: 18px;
        border-radius: 19px;
        background: rgba(255,255,255,.065);
        border: 1px solid rgba(255,255,255,.09);
    }

    .stat-number {
        font-size: 28px;
        font-weight: 800;
        margin-bottom: 5px;
    }

    .stat-label {
        opacity: .62;
        font-size: 13px;
    }

    .attendance-status {
        padding: 14px 17px;
        margin-bottom: 16px;
        border-radius: 16px;
        background: rgba(255,255,255,.06);
        border: 1px solid rgba(255,255,255,.08);
    }

    .attendance-list {
        display: grid;
        gap: 12px;
    }

    .attendance-card {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 15px;
        padding: 18px;
        border-radius: 19px;
        background: rgba(255,255,255,.065);
        border: 1px solid rgba(255,255,255,.09);
    }

    .attendance-date {
        font-weight: 700;
        margin-bottom: 6px;
    }

    .attendance-details {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
    }

    .meta {
        padding: 6px 9px;
        border-radius: 9px;
        background: rgba(255,255,255,.06);
        font-size: 12px;
        opacity: .72;
    }

    .status-badge {
        min-width: 95px;
        text-align: center;
        padding: 9px 12px;
        border-radius: 11px;
        font-weight: 700;
        font-size: 13px;
    }

    .present {
        background: rgba(60,200,120,.13);
    }

    .absent {
        background: rgba(255,80,80,.13);
    }

    .late {
        background: rgba(255,180,50,.14);
    }

    .unknown {
        background: rgba(255,255,255,.08);
    }

    .empty {
        padding: 42px 20px;
        text-align: center;
        border-radius: 20px;
        background: rgba(255,255,255,.05);
        border: 1px dashed rgba(255,255,255,.12);
    }

    .empty-icon {
        font-size: 42px;
        margin-bottom: 10px;
    }

    .empty p {
        margin: 0;
        opacity: .65;
    }

    .error {
        color: #ffb4b4;
    }

    @media (max-width: 600px) {
        .attendance-page {
            width: min(100% - 16px, 1100px);
        }

        .attendance-header {
            padding: 16px;
        }

        .attendance-header h1 {
            font-size: 24px;
        }

        .back-btn {
            padding: 9px 11px;
            font-size: 13px;
        }

        .stats {
            gap: 8px;
        }

        .stat {
            padding: 14px 10px;
        }

        .stat-number {
            font-size: 23px;
        }

        .stat-label {
            font-size: 11px;
        }

        .attendance-card {
            align-items: flex-start;
            flex-direction: column;
        }

        .status-badge {
            width: 100%;
            box-sizing: border-box;
        }
    }
</style>

</head><body><main class="attendance-page"><header class="attendance-header">
    <div>
        <h1>✅ Відвідування</h1>
        <p>Історія присутності та запізнень</p>
    </div>

    <a href="dashboard.html" class="back-btn">
        🏠 Головна
    </a>
</header>

<section class="stats">

    <div class="stat">
        <div class="stat-number" id="presentCount">—</div>
        <div class="stat-label">Присутні</div>
    </div>

    <div class="stat">
        <div class="stat-number" id="lateCount">—</div>
        <div class="stat-label">Запізнення</div>
    </div>

    <div class="stat">
        <div class="stat-number" id="absentCount">—</div>
        <div class="stat-label">Відсутні</div>
    </div>

</section>

<div id="attendanceStatus" class="attendance-status">
    Завантаження відвідування...
</div>

<section id="attendanceList" class="attendance-list"></section>

</main><script>
document.addEventListener("DOMContentLoaded", async () => {

    const status = document.getElementById("attendanceStatus");
    const list = document.getElementById("attendanceList");

    const presentCount = document.getElementById("presentCount");
    const lateCount = document.getElementById("lateCount");
    const absentCount = document.getElementById("absentCount");

    function escapeHTML(value) {
        if (value === null || value === undefined) return "";

        return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }

    function formatDate(value) {

        if (!value) return "Дата не вказана";

        const date = new Date(value);

        if (Number.isNaN(date.getTime())) {
            return escapeHTML(value);
        }

        return date.toLocaleDateString("uk-UA", {
            day: "2-digit",
            month: "long",
            year: "numeric"
        });
    }

    function getStatus(value) {

        const normalized = String(value || "")
            .toLowerCase()
            .trim();

        if (
            normalized === "present" ||
            normalized === "присутній" ||
            normalized === "присутня"
        ) {
            return {
                text: "Присутній",
                className: "present"
            };
        }

        if (
            normalized === "absent" ||
            normalized === "відсутній" ||
            normalized === "відсутня"
        ) {
            return {
                text: "Відсутній",
                className: "absent"
            };
        }

        if (
            normalized === "late" ||
            normalized === "запізнення"
        ) {
            return {
                text: "Запізнення",
                className: "late"
            };
        }

        return {
            text: value || "Не вказано",
            className: "unknown"
        };
    }

    function renderAttendance(records) {

        if (!records || records.length === 0) {

            presentCount.textContent = "0";
            lateCount.textContent = "0";
            absentCount.textContent = "0";

            status.textContent =
                "Даних про відвідування поки немає.";

            list.innerHTML = `
                <div class="empty">
                    <div class="empty-icon">✅</div>
                    <p>Інформація про відвідування з'явиться після внесення даних.</p>
                </div>
            `;

            return;
        }

        let present = 0;
        let late = 0;
        let absent = 0;

        records.forEach(record => {

            const value = String(record.status || "")
                .toLowerCase()
                .trim();

            if (
                value === "present" ||
                value === "присутній" ||
                value === "присутня"
            ) {
                present++;
            }

            if (
                value === "late" ||
                value === "запізнення"
            ) {
                late++;
            }

            if (
                value === "absent" ||
                value === "відсутній" ||
                value === "відсутня"
            ) {
                absent++;
            }

        });

        presentCount.textContent = present;
        lateCount.textContent = late;
        absentCount.textContent = absent;

        status.textContent =
            `Записів відвідування: ${records.length}`;

        list.innerHTML = records.map(record => {

            const state = getStatus(record.status);

            const className =
                record.class_name
                    ? `👥 ${escapeHTML(record.class_name)}`
                    : "";

            const lateMinutes =
                record.late_minutes
                    ? `⏱ ${escapeHTML(record.late_minutes)} хв.`
                    : "";

            const reason =
                record.reason
                    ? `💬 ${escapeHTML(record.reason)}`
                    : "";

            return `
                <article class="attendance-card">

                    <div>

                        <div class="attendance-date">
                            ${formatDate(record.attendance_date)}
                        </div>

                        <div class="attendance-details">

                            ${className
                                ? `<span class="meta">${className}</span>`
                                : ""
                            }

                            ${lateMinutes
                                ? `<span class="meta">${lateMinutes}</span>`
                                : ""
                            }

                            ${reason
                                ? `<span class="meta">${reason}</span>`
                                : ""
                            }

                        </div>

                    </div>

                    <div class="status-badge ${state.className}">
                        ${escapeHTML(state.text)}
                    </div>

                </article>
            `;

        }).join("");
    }

    try {

        if (!window.supabaseClient) {

            status.innerHTML =
                '<span class="error">Не вдалося підключити Supabase. Перевір supabase.js.</span>';

            return;
        }

        const {
            data: userData,
            error: userError
        } = await window.supabaseClient.auth.getUser();

        if (userError || !userData || !userData.user) {

            status.innerHTML =
                '<span class="error">Не вдалося визначити користувача.</span>';

            return;
        }

        const userId = userData.user.id;

        const {
            data: records,
            error
        } = await window.supabaseClient
            .from("attendance")
            .select("*")
            .eq("student_id", userId)
            .order("attendance_date", {
                ascending: false
            });

        if (error) {

            console.error("Supabase attendance error:", error);

            status.innerHTML =
                '<span class="error">Не вдалося завантажити відвідування. Перевір таблицю attendance та RLS.</span>';

            list.innerHTML = `
                <div class="empty">
                    <div class="empty-icon">⚠️</div>
                    <p>Supabase повернув помилку під час отримання відвідування.</p>
                </div>
            `;

            return;
        }

        renderAttendance(records);

    } catch (error) {

        console.error("Attendance loading error:", error);

        status.innerHTML =
            '<span class="error">Помилка під час завантаження відвідування.</span>';
    }

});
</script></body>
</html>
