<!DOCTYPE html><html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Розклад — Ліцей №2</title>  <link rel="stylesheet" href="style.css">  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  <script src="supabase.js"></script>  <script src="app.js" defer></script>  <style>
    body {
      background:
        radial-gradient(circle at top left, rgba(59,130,246,.18), transparent 35%),
        radial-gradient(circle at bottom right, rgba(14,165,233,.12), transparent 35%),
        #07111f;
    }

    .schedule-page {
      width: min(1100px, calc(100% - 28px));
      margin: 0 auto;
      padding: 28px 0 50px;
    }

    .schedule-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 22px;
      flex-wrap: wrap;
    }

    .schedule-header h1 {
      margin: 0;
      font-size: clamp(26px, 6vw, 42px);
    }

    .schedule-header p {
      margin: 7px 0 0;
      opacity: .7;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 11px 17px;
      border-radius: 14px;
      color: white;
      text-decoration: none;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.1);
    }

    .filters {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .filter {
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 18px;
      padding: 14px;
      backdrop-filter: blur(14px);
    }

    .filter label {
      display: block;
      font-size: 13px;
      opacity: .65;
      margin-bottom: 7px;
    }

    .filter select {
      width: 100%;
      box-sizing: border-box;
      padding: 11px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.2);
      color: white;
      outline: none;
    }

    .status {
      padding: 14px 16px;
      border-radius: 16px;
      margin-bottom: 18px;
      background: rgba(59,130,246,.1);
      border: 1px solid rgba(59,130,246,.18);
    }

    .schedule-list {
      display: grid;
      gap: 13px;
    }

    .lesson {
      position: relative;
      display: grid;
      grid-template-columns: 58px 1fr auto;
      gap: 15px;
      align-items: center;
      padding: 17px;
      border-radius: 20px;
      background: rgba(255,255,255,.055);
      border: 1px solid rgba(255,255,255,.09);
      box-shadow: 0 12px 35px rgba(0,0,0,.15);
      backdrop-filter: blur(16px);
    }

    .lesson-number {
      width: 48px;
      height: 48px;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(59,130,246,.18);
      border: 1px solid rgba(96,165,250,.22);
      font-size: 20px;
      font-weight: 800;
    }

    .subject {
      font-size: 18px;
      font-weight: 750;
      margin-bottom: 5px;
    }

    .details {
      display: flex;
      flex-wrap: wrap;
      gap: 7px 13px;
      opacity: .68;
      font-size: 13px;
    }

    .time {
      text-align: right;
      white-space: nowrap;
      font-weight: 700;
    }

    .empty {
      text-align: center;
      padding: 45px 20px;
      border-radius: 20px;
      background: rgba(255,255,255,.045);
      border: 1px dashed rgba(255,255,255,.12);
      opacity: .7;
    }

    @media (max-width: 650px) {
      .filters {
        grid-template-columns: 1fr;
      }

      .lesson {
        grid-template-columns: 48px 1fr;
      }

      .time {
        grid-column: 2;
        text-align: left;
        margin-top: -7px;
      }
    }
  </style></head><body>
  <main class="schedule-page"><header class="schedule-header">
  <div>
    <h1>📚 Розклад</h1>
    <p>Розклад занять Ліцею №2</p>
  </div>

  <a class="back-btn" href="dashboard.html">← Назад</a>
</header>

<section class="filters">
  <div class="filter">
    <label for="dayFilter">День</label>
    <select id="dayFilter">
      <option value="">Усі дні</option>
      <option value="Понеділок">Понеділок</option>
      <option value="Вівторок">Вівторок</option>
      <option value="Середа">Середа</option>
      <option value="Четвер">Четвер</option>
      <option value="П’ятниця">П’ятниця</option>
    </select>
  </div>

  <div class="filter">
    <label for="classFilter">Клас</label>
    <select id="classFilter">
      <option value="">Усі класи</option>
    </select>
  </div>
</section>

<div id="status" class="status">
  Завантаження розкладу…
</div>

<section id="scheduleList" class="schedule-list"></section>

  </main>  <script>
    let allLessons = [];

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatDay(day) {
      return day || "День не вказано";
    }

    function renderClassFilter() {
      const select = document.getElementById("classFilter");

      const classes = [...new Set(
        allLessons
          .map(item => item.class_name)
          .filter(Boolean)
      )].sort();

      select.innerHTML =
        '<option value="">Усі класи</option>' +
        classes.map(className =>
          `<option value="${escapeHtml(className)}">${escapeHtml(className)}</option>`
        ).join("");
    }

    function renderSchedule() {
      const day = document.getElementById("dayFilter").value;
      const className = document.getElementById("classFilter").value;
      const list = document.getElementById("scheduleList");

      let lessons = [...allLessons];

      if (day) {
        lessons = lessons.filter(item => item.day === day);
      }

      if (className) {
        lessons = lessons.filter(item => item.class_name === className);
      }

      lessons.sort((a, b) => {
        const dayOrder = {
          "Понеділок": 1,
          "Вівторок": 2,
          "Середа": 3,
          "Четвер": 4,
          "П’ятниця": 5,
          "Пятниця": 5
        };

        const dayA = dayOrder[a.day] || 99;
        const dayB = dayOrder[b.day] || 99;

        if (dayA !== dayB) return dayA - dayB;

        return (Number(a.lesson_number) || 999) -
               (Number(b.lesson_number) || 999);
      });

      if (!lessons.length) {
        list.innerHTML = `
          <div class="empty">
            <div style="font-size:32px;margin-bottom:8px;">📭</div>
            <div>Занять за вибраними параметрами немає.</div>
          </div>
        `;
        return;
      }

      list.innerHTML = lessons.map(item => `
        <article class="lesson">
          <div class="lesson-number">
            ${escapeHtml(item.lesson_number || "—")}
          </div>

          <div>
            <div class="subject">
              ${escapeHtml(item.subject || "Предмет не вказано")}
            </div>

            <div class="details">
              <span>📅 ${escapeHtml(formatDay(item.day))}</span>
              ${item.class_name ? `<span>👥 ${escapeHtml(item.class_name)}</span>` : ""}
              ${item.teacher ? `<span>👨‍🏫 ${escapeHtml(item.teacher)}</span>` : ""}
              ${item.room ? `<span>🚪 Каб. ${escapeHtml(item.room)}</span>` : ""}
            </div>
          </div>

          <div class="time">
            ${item.start_time || item.end_time
              ? `${escapeHtml(item.start_time || "")}${item.end_time ? " — " + escapeHtml(item.end_time) : ""}`
              : "Час не вказано"}
          </div>
        </article>
      `).join("");
    }

    async function loadSchedule() {
      const status = document.getElementById("status");

      if (!window.supabaseClient) {
        status.textContent =
          "Не вдалося підключити Supabase. Перевір файл supabase.js.";
        return;
      }

      try {
        const { data, error } = await window.supabaseClient
          .from("schedule")
          .select("*")
          .order("lesson_number", { ascending: true });

        if (error) {
          console.error("Помилка schedule:", error);
          status.textContent =
            "Не вдалося завантажити розклад. Перевір таблицю schedule та права доступу.";
          return;
        }

        allLessons = data || [];

        renderClassFilter();
        renderSchedule();

        status.textContent =
          allLessons.length
            ? `Завантажено занять: ${allLessons.length}`
            : "Розклад поки що порожній.";

      } catch (error) {
        console.error(error);
        status.textContent =
          "Сталася помилка під час завантаження розкладу.";
      }
    }

    document.getElementById("dayFilter")
      .addEventListener("change", renderSchedule);

    document.getElementById("classFilter")
      .addEventListener("change", renderSchedule);

    document.addEventListener("DOMContentLoaded", loadSchedule);
  </script></body>
</html>
