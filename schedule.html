<!DOCTYPE html><html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Розклад — Ліцей №2</title>

<link rel="stylesheet" href="style.css">

<style>
    .page {
        min-height: 100vh;
        background: var(--background);
    }

    .page-header {
        padding: 30px 20px 20px;
    }

    .page-container {
        max-width: 1200px;
        margin: 0 auto;
    }

    .top-bar {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 15px;
        margin-bottom: 25px;
    }

    .back-link {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        color: var(--primary);
        text-decoration: none;
        font-size: 13px;
        font-weight: 700;
        margin-bottom: 12px;
    }

    .page-title h1 {
        font-size: clamp(28px, 5vw, 38px);
        margin-bottom: 6px;
    }

    .page-title p {
        color: var(--text-light);
        font-size: 13px;
    }

    .today-button {
        border: 0;
        background: var(--primary);
        color: white;
        padding: 11px 16px;
        border-radius: 11px;
        font-family: inherit;
        font-weight: 700;
        font-size: 12px;
        cursor: pointer;
    }

    .class-select {
        width: 100%;
        border: 1px solid var(--border);
        background: white;
        color: var(--text);
        padding: 13px 14px;
        border-radius: 12px;
        font-family: inherit;
        margin-bottom: 15px;
        outline: none;
    }

    .week-selector {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding-bottom: 5px;
        margin-bottom: 20px;
    }

    .day-button {
        flex: 1;
        min-width: 115px;
        border: 1px solid var(--border);
        background: white;
        color: var(--text);
        padding: 13px 12px;
        border-radius: 13px;
        cursor: pointer;
        font-family: inherit;
    }

    .day-button.active {
        background: var(--primary);
        border-color: var(--primary);
        color: white;
    }

    .day-name {
        display: block;
        font-size: 12px;
        font-weight: 800;
    }

    .day-date {
        display: block;
        margin-top: 3px;
        font-size: 10px;
        opacity: .75;
    }

    .schedule-card {
        background: white;
        border: 1px solid var(--border);
        border-radius: 20px;
        overflow: hidden;
        box-shadow: var(--shadow-sm);
    }

    .schedule-card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 15px;
        padding: 20px 22px;
        border-bottom: 1px solid var(--border);
    }

    .schedule-card-header h2 {
        font-size: 19px;
    }

    .lesson-count {
        color: var(--text-muted);
        font-size: 11px;
    }

    .lesson-list {
        display: flex;
        flex-direction: column;
    }

    .lesson {
        display: grid;
        grid-template-columns: 55px 105px 1fr 130px;
        align-items: center;
        min-height: 76px;
        padding: 10px 20px;
        border-bottom: 1px solid var(--border);
    }

    .lesson:last-child {
        border-bottom: 0;
    }

    .lesson-number {
        width: 34px;
        height: 34px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 10px;
        background: #f0f1f7;
        font-size: 13px;
        font-weight: 800;
    }

    .lesson-time {
        font-size: 12px;
        font-weight: 700;
    }

    .lesson-time small {
        display: block;
        margin-top: 3px;
        color: var(--text-muted);
        font-size: 9px;
        font-weight: 500;
    }

    .lesson-subject {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .subject-icon {
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 11px;
        background: var(--primary-soft);
        font-size: 18px;
    }

    .subject-name {
        font-size: 14px;
        font-weight: 800;
    }

    .teacher-name {
        margin-top: 3px;
        color: var(--text-muted);
        font-size: 10px;
    }

    .room {
        color: var(--text-light);
        font-size: 11px;
    }

    .loading-message,
    .empty-message,
    .error-message {
        padding: 50px 20px;
        text-align: center;
        color: var(--text-muted);
    }

    .error-message {
        display: none;
        color: #b42318;
    }

    .schedule-footer {
        display: flex;
        justify-content: space-between;
        gap: 15px;
        margin-top: 20px;
        color: var(--text-muted);
        font-size: 11px;
    }

    @media (max-width: 700px) {
        .page-header {
            padding: 20px 12px;
        }

        .top-bar {
            align-items: flex-start;
        }

        .lesson {
            grid-template-columns: 38px 65px 1fr;
            padding: 10px 13px;
            min-height: 70px;
        }

        .room {
            display: none;
        }

        .subject-icon {
            width: 34px;
            height: 34px;
        }

        .subject-name {
            font-size: 12px;
        }

        .teacher-name {
            font-size: 9px;
        }

        .lesson-time {
            font-size: 10px;
        }

        .week-selector {
            margin-left: -12px;
            margin-right: -12px;
            padding-left: 12px;
            padding-right: 12px;
        }

        .day-button {
            min-width: 95px;
        }
    }
</style>

</head><body><div class="page"><header class="page-header">

    <div class="page-container">

        <div class="top-bar">

            <div class="page-title">

                <a href="dashboard.html" class="back-link">
                    ← Особистий кабінет
                </a>

                <h1>Розклад</h1>

                <p>
                    Розклад уроків із системи ліцею
                </p>

            </div>

            <button
                class="today-button"
                onclick="showToday()"
            >
                📅 Сьогодні
            </button>

        </div>

        <select
            id="classSelect"
            class="class-select"
            onchange="changeClass()"
        >
            <option value="">
                Усі класи
            </option>
        </select>

        <div class="week-selector">

            <button class="day-button active" data-day="monday" onclick="selectDay('monday', this)">
                <span class="day-name">Понеділок</span>
                <span class="day-date" id="date-monday"></span>
            </button>

            <button class="day-button" data-day="tuesday" onclick="selectDay('tuesday', this)">
                <span class="day-name">Вівторок</span>
                <span class="day-date" id="date-tuesday"></span>
            </button>

            <button class="day-button" data-day="wednesday" onclick="selectDay('wednesday', this)">
                <span class="day-name">Середа</span>
                <span class="day-date" id="date-wednesday"></span>
            </button>

            <button class="day-button" data-day="thursday" onclick="selectDay('thursday', this)">
                <span class="day-name">Четвер</span>
                <span class="day-date" id="date-thursday"></span>
            </button>

            <button class="day-button" data-day="friday" onclick="selectDay('friday', this)">
                <span class="day-name">П'ятниця</span>
                <span class="day-date" id="date-friday"></span>
            </button>

        </div>

        <section class="schedule-card">

            <div class="schedule-card-header">

                <h2 id="selectedDayTitle">
                    Понеділок
                </h2>

                <span
                    class="lesson-count"
                    id="lessonCount"
                >
                    0 уроків
                </span>

            </div>

            <div
                class="loading-message"
                id="loadingMessage"
            >
                ⏳ Завантаження розкладу...
            </div>

            <div
                class="lesson-list"
                id="lessonList"
            ></div>

            <div
                class="empty-message"
                id="emptyMessage"
                style="display:none;"
            >
                📭 На цей день уроків немає.
            </div>

            <div
                class="error-message"
                id="errorMessage"
            >
                ⚠️ Не вдалося завантажити розклад.
                <br>
                <span id="errorText"></span>
            </div>

        </section>

        <div class="schedule-footer">

            <span>
                Розклад завантажується із Supabase.
            </span>

            <span>
                Версія 0.2
            </span>

        </div>

    </div>

</header>

</div><script src="supabase.js"></script><script src="app.js"></script><script>

let scheduleData = [];
let selectedDay = "monday";
let selectedClass = "";

const dayNames = {
    monday: "Понеділок",
    tuesday: "Вівторок",
    wednesday: "Середа",
    thursday: "Четвер",
    friday: "П'ятниця"
};

const subjectIcons = {
    "Математика": "📐",
    "Українська мова": "📖",
    "Українська література": "📚",
    "Географія": "🌍",
    "Біологія": "🧬",
    "Англійська мова": "🇬🇧",
    "Німецька мова": "🇩🇪",
    "Історія": "🏛️",
    "Фізична культура": "🏃",
    "Інформатика": "💻",
    "Фізика": "⚡",
    "Хімія": "🧪",
    "Мистецтво": "🎨",
    "Технології": "🛠️"
};

function getSubjectIcon(subject) {
    return subjectIcons[subject] || "📘";
}

function escapeHtml(value) {
    if (value === null || value === undefined) return "";

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function normalizeDay(day) {

    if (!day) return "";

    const value = String(day).toLowerCase().trim();

    const map = {
        "понеділок": "monday",
        "понедельник": "monday",
        "monday": "monday",

        "вівторок": "tuesday",
        "вторник": "tuesday",
        "tuesday": "tuesday",

        "середа": "wednesday",
        "среда": "wednesday",
        "wednesday": "wednesday",

        "четвер": "thursday",
        "thursday": "thursday",

        "п'ятниця": "friday",
        "пятниця": "friday",
        "пятница": "friday",
        "friday": "friday"
    };

    return map[value] || value;
}

function populateClasses() {

    const select = document.getElementById("classSelect");

    const classes = [
        ...new Set(
            scheduleData
                .map(item => item.class_name)
                .filter(Boolean)
        )
    ].sort();

    select.innerHTML =
        `<option value="">Усі класи</option>`;

    classes.forEach(className => {

        const option = document.createElement("option");

        option.value = className;
        option.textContent = className;

        select.appendChild(option);
    });
}

function changeClass() {

    selectedClass =
        document.getElementById("classSelect").value;

    renderSchedule();
}

function getDayLessons() {

    return scheduleData
        .filter(item => {

            const sameDay =
                normalizeDay(item.day) === selectedDay;

            const sameClass =
                !selectedClass ||
                item.class_name === selectedClass;

            return sameDay && sameClass;
        })
        .sort((a, b) => {
            return Number(a.lesson_number || 0) -
                   Number(b.lesson_number || 0);
        });
}

function renderSchedule() {

    const list =
        document.getElementById("lessonList");

    const loading =
        document.getElementById("loadingMessage");

    const empty =
        document.getElementById("emptyMessage");

    const lessons =
        getDayLessons();

    loading.style.display = "none";
    list.innerHTML = "";

    document.getElementById("selectedDayTitle").textContent =
        dayNames[selectedDay] || selectedDay;

    document.getElementById("lessonCount").textContent =
        `${lessons.length} ${getLessonWord(lessons.length)}`;

    if (lessons.length === 0) {

        empty.style.display = "block";

        return;
    }

    empty.style.display = "none";

    lessons.forEach(item => {

        const lesson = document.createElement("div");

        lesson.className = "lesson";

        lesson.innerHTML = `

            <div class="lesson-number">
                ${escapeHtml(item.lesson_number || "—")}
            </div>

            <div class="lesson-time">
                ${escapeHtml(item.start_time || "—")}
                <small>
                    ${escapeHtml(item.end_time || "")}
                </small>
            </div>

            <div class="lesson-subject">

                <div class="subject-icon">
                    ${getSubjectIcon(item.subject)}
                </div>

                <div>

                    <div class="subject-name">
                        ${escapeHtml(item.subject)}
                    </div>

                    ${item.teacher
                        ? `<div class="teacher-name">
                            👨‍🏫 ${escapeHtml(item.teacher)}
                           </div>`
                        : ""}

                    ${item.class_name
                        ? `<div class="teacher-name">
                            🏫 ${escapeHtml(item.class_name)}
                           </div>`
                        : ""}

                </div>

            </div>

            <div class="room">
                ${item.room
                    ? "📍 " + escapeHtml(item.room)
                    : ""}
            </div>
        `;

        list.appendChild(lesson);
    });
}

function getLessonWord(number) {

    if (number === 1) return "урок";
    if (number >= 2 && number <= 4) return "уроки";

    return "уроків";
}

function selectDay(day, button) {

    selectedDay = day;

    document
        .querySelectorAll(".day-button")
        .forEach(item => item.classList.remove("active"));

    button.classList.add("active");

    renderSchedule();
}

function getMonday(date) {

    const result = new Date(date);

    const day = result.getDay();

    const difference =
        day === 0 ? -6 : 1 - day;

    result.setDate(result.getDate() + difference);

    return result;
}

function updateWeekDates() {

    const monday = getMonday(new Date());

    const days = [
        "monday",
        "tuesday",
        "wednesday",
        "thursday",
        "friday"
    ];

    days.forEach((day, index) => {

        const date = new Date(monday);

        date.setDate(
            monday.getDate() + index
        );

        document.getElementById(
            `date-${day}`
        ).textContent =
            date.toLocaleDateString("uk-UA", {
                day: "numeric",
                month: "long"
            });
    });
}

function showToday() {

    const dayNumber =
        new Date().getDay();

    const map = {
        1: "monday",
        2: "tuesday",
        3: "wednesday",
        4: "thursday",
        5: "friday"
    };

    const today = map[dayNumber];

    if (!today) return;

    const button =
        document.querySelector(
            `[data-day="${today}"]`
        );

    if (button) {
        selectDay(today, button);

        button.scrollIntoView({
            behavior: "smooth",
            block: "nearest",
            inline: "center"
        });
    }
}

async function loadSchedule() {

    try {

        if (
            typeof supabaseClient === "undefined" ||
            !supabaseClient
        ) {
            throw new Error(
                "Supabase не підключено."
            );
        }

        const { data, error } =
            await supabaseClient
                .from("schedule")
                .select("*")
                .order("lesson_number", {
                    ascending: true
                });

        if (error) {
            throw error;
        }

        scheduleData = data || [];

        populateClasses();

        renderSchedule();

    } catch (error) {

        console.error(
            "Schedule loading error:",
            error
        );

        document.getElementById(
            "loadingMessage"
        ).style.display = "none";

        document.getElementById(
            "errorMessage"
        ).style.display = "block";

        document.getElementById(
            "errorText"
        ).textContent =
            error.message || "Невідома помилка.";
    }
}

document.addEventListener(
    "DOMContentLoaded",
    () => {

        updateWeekDates();

        loadSchedule();

    }
);

</script></body>
</html>
