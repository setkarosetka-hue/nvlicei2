<!DOCTYPE html><html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#07111f">

<title>Технічні роботи — Ліцей №2</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="app.js" defer></script>

</head><body class="maintenance-page"><div class="page-background"></div>

<main class="maintenance-container">

    <div class="maintenance-logo">
        <span class="maintenance-logo-mark">Л2</span>
        <span class="maintenance-logo-text">Ліцей №2</span>
    </div>

    <section class="maintenance-card">

        <div class="maintenance-icon">
            🔧
        </div>

        <span class="eyebrow">
            ТЕХНІЧНІ РОБОТИ
        </span>

        <h1>
            Система тимчасово недоступна
        </h1>

        <p class="maintenance-description">
            Зараз виконуються технічні роботи.
            Ми працюємо над оновленням цифрової системи ліцею.
        </p>

        <div class="maintenance-status">
            <span class="status-dot"></span>
            <span>Технічні роботи тривають</span>
        </div>

        <div class="maintenance-info">

            <div class="maintenance-info-row">
                <span>Причина</span>
                <strong id="maintenanceReason">
                    Оновлення системи
                </strong>
            </div>

            <div class="maintenance-info-row">
                <span>Орієнтовне завершення</span>
                <strong id="maintenanceEnd">
                    Інформація уточнюється
                </strong>
            </div>

        </div>

        <button
            type="button"
            class="secondary-button"
            id="refreshButton"
        >
            Перевірити ще раз
        </button>

        <a href="index.html" class="maintenance-home">
            ← На головну
        </a>

    </section>

    <p class="maintenance-footer">
        © <span id="currentYear"></span> Ліцей №2
    </p>

</main>

<script>
    document.addEventListener('DOMContentLoaded', () => {

        const reasonElement =
            document.getElementById('maintenanceReason');

        const endElement =
            document.getElementById('maintenanceEnd');

        const refreshButton =
            document.getElementById('refreshButton');

        function formatEndTime(value) {

            if (!value) {
                return 'Інформація уточнюється';
            }

            const date = new Date(value);

            if (Number.isNaN(date.getTime())) {
                return value;
            }

            return date.toLocaleString('uk-UA', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function loadMaintenanceInfo() {

            if (typeof getMaintenanceState !== 'function') {
                return;
            }

            const state = getMaintenanceState();

            if (!state?.enabled) {
                location.href = 'index.html';
                return;
            }

            if (state.reason) {
                reasonElement.textContent = state.reason;
            }

            if (state.endTime) {
                endElement.textContent =
                    formatEndTime(state.endTime);
            }
        }

        refreshButton.addEventListener('click', () => {
            location.reload();
        });

        loadMaintenanceInfo();

    });
</script>

</body>
</html>
