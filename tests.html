<!DOCTYPE html><html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Тести — Ліцей №2</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="app.js" defer></script>

<style>
    .tests-page {
        width: min(1100px, calc(100% - 24px));
        margin: auto;
        padding: 20px 0 40px;
    }

    .tests-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 20px;
        padding: 20px;
        border-radius: 22px;
        background: rgba(255,255,255,.07);
        border: 1px solid rgba(255,255,255,.1);
    }

    .tests-header h1 {
        margin: 0 0 5px;
    }

    .tests-header p {
        margin: 0;
        opacity: .65;
    }

    .back-btn {
        padding: 10px 15px;
        border-radius: 13px;
        text-decoration: none;
        color: inherit;
        background: rgba(255,255,255,.09);
        border: 1px solid rgba(255,255,255,.1);
        white-space: nowrap;
    }

    .tests-status {
        padding: 15px 18px;
        margin-bottom: 18px;
        border-radius: 17px;
        background: rgba(255,255,255,.06);
        border: 1px solid rgba(255,255,255,.08);
    }

    .tests-list {
        display: grid;
        gap: 14px;
    }

    .test-card {
        padding: 20px;
        border-radius: 20px;
        background: rgba(255,255,255,.065);
        border: 1px solid rgba(255,255,255,.09);
        transition: transform .2s ease, background .2s ease;
    }

    .test-card:hover {
        transform: translateY(-2px);
        background: rgba(255,255,255,.09);
    }

    .test-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
    }

    .test-card h2 {
        margin: 0 0 7px;
        font-size: 20px;
    }

    .subject {
        display: inline-block;
        padding: 6px 10px;
        border-radius: 10px;
        background: rgba(0,170,255,.13);
        font-size: 13px;
    }

    .test-description {
        margin: 15px 0;
        line-height: 1.55;
        opacity: .78;
    }

    .test-info {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 12px;
    }

    .info-item {
        padding: 7px 10px;
        border-radius: 10px;
        background: rgba(255,255,255,.06);
        font-size: 13px;
        opacity: .75;
    }

    .test-link {
        display: inline-flex;
        margin-top: 16px;
        padding: 10px 14px;
        border-radius: 12px;
        text-decoration: none;
        color: inherit;
        background: rgba(0,170,255,.16);
        border: 1px solid rgba(0,170,255,.22);
        font-weight: 600;
    }

    .test-link:hover {
        background: rgba(0,170,255,.24);
    }

    .empty {
        padding: 35px 20px;
        text-align: center;
        border-radius: 20px;
        background: rgba(255,255,255,.05);
        border: 1px dashed rgba(255,255,255,.12);
    }

    .empty-icon {
        font-size: 40px;
        margin-bottom: 10px;
    }

    .empty p {
        margin: 0;
        opacity: .65;
    }

    .error {
        color: #ffb4b4;
    }

    @media (max-width: 600px) {
        .tests-page {
            width: min(100% - 16px, 1100px);
        }

        .tests-header {
            padding: 16px;
        }

        .tests-header h1 {
            font-size: 24px;
        }

        .back-btn {
            padding: 9px 11px;
            font-size: 13px;
        }

        .test-card {
            padding: 17px;
        }

        .test-top {
            flex-direction: column;
        }
    }
</style>

</head><body><main class="tests-page"><header class="tests-header">
    <div>
        <h1>📝 Тести</h1>
        <p>Навчальні та контрольні тести ліцею</p>
    </div>

    <a href="dashboard.html" class="back-btn">
        🏠 Головна
    </a>
</header>

<div id="testsStatus" class="tests-status">
    Завантаження тестів...
</div>

<section id="testsList" class="tests-list"></section>

</main><script>
document.addEventListener("DOMContentLoaded", async () => {

    const status = document.getElementById("testsStatus");
    const list = document.getElementById("testsList");

    function escapeHTML(value) {
        if (value === null || value === undefined) return "";

        return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }

    function formatDate(value) {
        if (!value) return "";

        const date = new Date(value);

        if (Number.isNaN(date.getTime())) {
            return escapeHTML(value);
        }

        return date.toLocaleDateString("uk-UA", {
            day: "2-digit",
            month: "2-digit",
            year: "numeric"
        });
    }

    function renderTests(tests) {

        if (!tests || tests.length === 0) {

            status.textContent = "Нових тестів поки немає.";

            list.innerHTML = `
                <div class="empty">
                    <div class="empty-icon">📝</div>
                    <p>Коли учитель додасть тест, він з'явиться тут.</p>
                </div>
            `;

            return;
        }

        status.textContent =
            `Знайдено тестів: ${tests.length}`;

        list.innerHTML = tests.map(test => {

            const title =
                escapeHTML(test.title || "Тест");

            const subject =
                escapeHTML(test.subject || "Предмет не вказано");

            const description =
                escapeHTML(test.description || "Опис тесту відсутній.");

            const className =
                escapeHTML(test.class_name || "Усі класи");

            const dueDate =
                test.due_date
                    ? `📅 До ${formatDate(test.due_date)}`
                    : "📅 Дата не вказана";

            const link =
                test.test_url
                    ? `
                        <a
                            class="test-link"
                            href="${escapeHTML(test.test_url)}"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            ▶ Відкрити тест
                        </a>
                    `
                    : "";

            return `
                <article class="test-card">

                    <div class="test-top">
                        <div>
                            <h2>${title}</h2>
                            <span class="subject">${subject}</span>
                        </div>
                    </div>

                    <p class="test-description">
                        ${description}
                    </p>

                    <div class="test-info">
                        <span class="info-item">
                            👥 ${className}
                        </span>

                        <span class="info-item">
                            ${dueDate}
                        </span>
                    </div>

                    ${link}

                </article>
            `;

        }).join("");
    }

    try {

        if (!window.supabaseClient) {

            status.innerHTML =
                '<span class="error">Не вдалося підключити Supabase. Перевір supabase.js.</span>';

            return;
        }

        const {
            data: tests,
            error
        } = await window.supabaseClient
            .from("tests")
            .select("*")
            .order("due_date", {
                ascending: true,
                nullsFirst: false
            });

        if (error) {

            console.error("Supabase tests error:", error);

            status.innerHTML =
                '<span class="error">Не вдалося завантажити тести. Перевір таблицю tests та права доступу.</span>';

            list.innerHTML = `
                <div class="empty">
                    <div class="empty-icon">⚠️</div>
                    <p>Supabase повернув помилку під час отримання тестів.</p>
                </div>
            `;

            return;
        }

        renderTests(tests);

    } catch (error) {

        console.error("Tests loading error:", error);

        status.innerHTML =
            '<span class="error">Помилка під час завантаження тестів.</span>';

    }

});
</script></body>
</html>
