<!DOCTYPE html><html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Оголошення — Ліцей №2</title>
<link rel="stylesheet" href="style.css"><style>
body{
    margin:0;
    min-height:100vh;
    background:
        radial-gradient(circle at top left,rgba(37,99,235,.25),transparent 35%),
        radial-gradient(circle at bottom right,rgba(14,165,233,.18),transparent 35%),
        #07111f;
    color:#fff;
    font-family:Arial,sans-serif;
}

.page{
    width:min(1000px,calc(100% - 24px));
    margin:auto;
    padding:20px 0 50px;
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    padding:20px;
    margin-bottom:18px;
    border-radius:22px;
    background:rgba(10,24,42,.85);
    border:1px solid rgba(255,255,255,.1);
}

.top h1{
    margin:0 0 5px;
}

.top p{
    margin:0;
    color:#8fa2b8;
}

.back{
    color:white;
    text-decoration:none;
    padding:10px 14px;
    border-radius:12px;
    background:rgba(255,255,255,.07);
}

.announcements{
    display:flex;
    flex-direction:column;
    gap:14px;
}

.announcement{
    padding:21px;
    border-radius:21px;
    background:rgba(10,24,42,.8);
    border:1px solid rgba(255,255,255,.09);
    transition:.2s;
}

.announcement:hover{
    transform:translateY(-2px);
    border-color:rgba(37,99,235,.35);
}

.announcement-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:15px;
}

.title{
    font-size:19px;
    font-weight:700;
}

.date{
    color:#7f92a8;
    font-size:12px;
    white-space:nowrap;
}

.content{
    margin-top:13px;
    color:#c9d7e7;
    line-height:1.6;
    white-space:pre-wrap;
}

.audience{
    display:inline-block;
    margin-top:15px;
    padding:5px 10px;
    border-radius:999px;
    background:rgba(37,99,235,.14);
    color:#8bb7ff;
    font-size:12px;
}

.empty{
    text-align:center;
    padding:55px 20px;
    border-radius:20px;
    background:rgba(10,24,42,.7);
    color:#8194aa;
}

.loading{
    text-align:center;
    color:#8194aa;
    padding:40px;
}

@media(max-width:600px){

    .top{
        flex-direction:column;
        align-items:flex-start;
    }

    .announcement-head{
        flex-direction:column;
    }

    .date{
        white-space:normal;
    }
}
</style></head><body><div class="page"><header class="top"><div>
<h1>📢 Оголошення</h1>
<p>Важлива інформація від Ліцею №2</p>
</div><a href="dashboard.html" class="back">
← Назад
</a></header><main><div id="announcements" class="announcements"><div class="loading">
Завантаження оголошень...
</div></div></main></div><script src="supabase.js"></script><script src="app.js"></script><script>

document.addEventListener("DOMContentLoaded",async()=>{

const container=document.getElementById("announcements");

const {
data:{user},
error:authError
}=await supabaseClient.auth.getUser();

if(authError || !user){

location.href="login.html";

return;

}


function escape(value){

return String(value??"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


function formatDate(value){

if(!value)return "";

return new Date(value).toLocaleString("uk-UA",{
day:"2-digit",
month:"2-digit",
year:"numeric",
hour:"2-digit",
minute:"2-digit"
});

}


const {
data:profile,
error:profileError
}=await supabaseClient
.from("profiles")
.select("role")
.eq("id",user.id)
.single();


if(profileError || !profile){

container.innerHTML=`
<div class="empty">
Не вдалося визначити вашу роль.
</div>`;

return;

}


let audience="all";

if(profile.role==="teacher"){
audience="teachers";
}

if(profile.role==="student"){
audience="students";
}

if(profile.role==="parent"){
audience="parents";
}


const {
data,
error
}=await supabaseClient
.from("announcements")
.select("*")
.or(`audience.eq.all,audience.eq.${audience}`)
.order("created_at",{ascending:false});


if(error){

console.error(error);

container.innerHTML=`
<div class="empty">
Не вдалося завантажити оголошення.
</div>`;

return;

}


if(!data || !data.length){

container.innerHTML=`
<div class="empty">
📭<br><br>
Поки що немає оголошень.
</div>`;

return;

}


const audienceNames={

all:"Для всіх",

teachers:"Для вчителів",

students:"Для учнів",

parents:"Для батьків"

};


container.innerHTML=data.map(item=>`

<article class="announcement">

<div class="announcement-head">

<div class="title">
${escape(item.title)}
</div>

<div class="date">
${formatDate(item.created_at)}
</div>

</div>

<div class="content">
${escape(item.content)}
</div>

<div class="audience">
${audienceNames[item.audience]||"Оголошення"}
</div>

</article>

`).join("");

});

</script></body>
</html>
