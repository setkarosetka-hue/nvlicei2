<!DOCTYPE html><html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Інформація — Ліцей №2</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="app.js" defer></script>

<style>
    .info-page {
        width: min(1100px, calc(100% - 24px));
        margin: auto;
        padding: 20px 0 40px;
    }

    .info-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 20px;
        margin-bottom: 18px;
        border-radius: 22px;
        background: rgba(255,255,255,.07);
        border: 1px solid rgba(255,255,255,.1);
    }

    .info-header h1 {
        margin: 0 0 5px;
    }

    .info-header p {
        margin: 0;
        opacity: .65;
    }

    .back-btn {
        padding: 10px 15px;
        border-radius: 13px;
        text-decoration: none;
        color: inherit;
        background: rgba(255,255,255,.09);
        border: 1px solid rgba(255,255,255,.1);
        white-space: nowrap;
    }

    .info-status {
        padding: 14px 17px;
        margin-bottom: 16px;
        border-radius: 16px;
        background: rgba(255,255,255,.06);
        border: 1px solid rgba(255,255,255,.08);
    }

    .announcements-list {
        display: grid;
        gap: 14px;
    }

    .announcement {
        padding: 21px;
        border-radius: 21px;
        background: rgba(255,255,255,.065);
        border: 1px solid rgba(255,255,255,.09);
    }

    .announcement:hover {
        background: rgba(255,255,255,.09);
    }

    .announcement-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 14px;
    }

    .announcement h2 {
        margin: 0 0 8px;
        font-size: 21px;
    }

    .announcement-date {
        font-size: 12px;
        opacity: .55;
        white-space: nowrap;
    }

    .announcement-content {
        margin-top: 15px;
        line-height: 1.65;
        white-space: pre-wrap;
        opacity: .8;
    }

    .announcement-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 16px;
    }

    .meta {
        padding: 6px 10px;
        border-radius: 9px;
        background: rgba(255,255,255,.06);
        font-size: 12px;
        opacity: .7;
    }

    .empty {
        padding: 42px 20px;
        text-align: center;
        border-radius: 20px;
        background: rgba(255,255,255,.05);
        border: 1px dashed rgba(255,255,255,.12);
    }

    .empty-icon {
        font-size: 42px;
        margin-bottom: 10px;
    }

    .empty p {
        margin: 0;
        opacity: .65;
    }

    .error {
        color: #ffb4b4;
    }

    @media (max-width: 600px) {
        .info-page {
            width: min(100% - 16px, 1100px);
        }

        .info-header {
            padding: 16px;
        }

        .info-header h1 {
            font-size: 24px;
        }

        .back-btn {
            padding: 9px 11px;
            font-size: 13px;
        }

        .announcement {
            padding: 17px;
        }

        .announcement-top {
            flex-direction: column;
        }

        .announcement-date {
            white-space: normal;
        }
    }
</style>

</head><body><main class="info-page"><header class="info-header">
    <div>
        <h1>📢 Інформація</h1>
        <p>Оголошення та важлива інформація ліцею</p>
    </div>

    <a href="dashboard.html" class="back-btn">
        🏠 Головна
    </a>
</header>

<div id="infoStatus" class="info-status">
    Завантаження інформації...
</div>

<section id="announcementsList" class="announcements-list"></section>

</main><script>
document.addEventListener("DOMContentLoaded", async () => {

    const status = document.getElementById("infoStatus");
    const list = document.getElementById("announcementsList");

    function escapeHTML(value) {
        if (value === null || value === undefined) return "";

        return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }

    function formatDate(value) {

        if (!value) {
            return "Дата не вказана";
        }

        const date = new Date(value);

        if (Number.isNaN(date.getTime())) {
            return escapeHTML(value);
        }

        return date.toLocaleString("uk-UA", {
            day: "2-digit",
            month: "2-digit",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit"
        });
    }

    function audienceName(value) {

        const names = {
            all: "Усім",
            students: "Учням",
            teachers: "Учителям",
            parents: "Батькам"
        };

        return names[value] || value || "Усім";
    }

    function renderAnnouncements(announcements) {

        if (!announcements || announcements.length === 0) {

            status.textContent =
                "Нових оголошень поки немає.";

            list.innerHTML = `
                <div class="empty">
                    <div class="empty-icon">📢</div>
                    <p>Коли адміністрація опублікує інформацію, вона з'явиться тут.</p>
                </div>
            `;

            return;
        }

        status.textContent =
            `Оголошень: ${announcements.length}`;

        list.innerHTML = announcements.map(item => {

            const title =
                escapeHTML(item.title || "Оголошення");

            const content =
                escapeHTML(item.content || "");

            const audience =
                escapeHTML(audienceName(item.audience));

            return `
                <article class="announcement">

                    <div class="announcement-top">

                        <div>
                            <h2>${title}</h2>
                        </div>

                        <div class="announcement-date">
                            ${formatDate(item.created_at)}
                        </div>

                    </div>

                    <div class="announcement-content">
                        ${content}
                    </div>

                    <div class="announcement-meta">

                        <span class="meta">
                            👥 ${audience}
                        </span>

                    </div>

                </article>
            `;

        }).join("");
    }

    try {

        if (!window.supabaseClient) {

            status.innerHTML =
                '<span class="error">Не вдалося підключити Supabase. Перевір supabase.js.</span>';

            return;
        }

        const {
            data: announcements,
            error
        } = await window.supabaseClient
            .from("announcements")
            .select("id,title,content,audience,created_at,updated_at")
            .order("created_at", {
                ascending: false
            });

        if (error) {

            console.error("Supabase announcements error:", error);

            status.innerHTML =
                '<span class="error">Не вдалося завантажити інформацію. Перевір таблицю announcements та RLS.</span>';

            list.innerHTML = `
                <div class="empty">
                    <div class="empty-icon">⚠️</div>
                    <p>Supabase повернув помилку під час отримання оголошень.</p>
                </div>
            `;

            return;
        }

        renderAnnouncements(announcements);

    } catch (error) {

        console.error("Announcements loading error:", error);

        status.innerHTML =
            '<span class="error">Помилка під час завантаження інформації.</span>';
    }

});
</script></body>
</html>
