<!DOCTYPE html><html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#07111f"><title>Оголошення — Ліцей №2</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="app.js" defer></script>

</head><body><header class="site-header">
    <div class="container header-inner">    <a href="dashboard.html" class="brand">
        <span class="brand-mark">Л2</span>

        <span class="brand-text">
            <strong>Ліцей №2</strong>
            <small>Оголошення</small>
        </span>
    </a>

    <button
        type="button"
        class="mobile-menu-button"
        id="mobileMenuButton"
        aria-label="Відкрити меню"
        aria-expanded="false">
        ☰
    </button>

    <nav class="main-nav" id="mainNav">
        <a href="dashboard.html">Кабінет</a>
        <a href="schedule.html">Розклад</a>
        <a href="homework.html">Домашні завдання</a>
        <a href="announcements.html" class="active">Оголошення</a>
    </nav>

</div>

</header><main class="container page-content"><section class="page-hero">
    <div>
        <span class="eyebrow">Ліцей №2</span>
        <h1>Оголошення</h1>
        <p>Важливі повідомлення та новини ліцею.</p>
    </div>
</section>

<section id="announcementStatus" class="status-box">
    Завантаження оголошень...
</section>

<section id="announcementList" class="announcement-list"></section>

</main><footer class="site-footer">
    <div class="container">
        <p>© <span id="currentYear"></span> Ліцей №2</p>
    </div>
</footer><style>
    .page-content {
        padding-top: 28px;
        padding-bottom: 48px;
    }

    .page-hero {
        margin-bottom: 20px;
        padding: 26px;
        border: 1px solid var(--border-color);
        border-radius: 22px;
        background:
            radial-gradient(circle at top right, rgba(70, 130, 255, .18), transparent 35%),
            var(--surface-color);
    }

    .page-hero h1 {
        margin: 6px 0 8px;
        font-size: clamp(27px, 5vw, 38px);
    }

    .page-hero p {
        margin: 0;
        color: var(--muted-text);
    }

    .eyebrow {
        color: var(--primary-color);
        font-size: 13px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: .08em;
    }

    .status-box {
        padding: 18px;
        margin-bottom: 14px;
        border: 1px solid var(--border-color);
        border-radius: 16px;
        background: var(--surface-color);
        color: var(--muted-text);
        text-align: center;
    }

    .status-box.error-state {
        color: #ff9d9d;
        border-color: rgba(255, 90, 90, .35);
    }

    .announcement-list {
        display: grid;
        gap: 14px;
    }

    .announcement-card {
        position: relative;
        padding: 20px;
        border: 1px solid var(--border-color);
        border-radius: 19px;
        background: var(--surface-color);
        overflow: hidden;
    }

    .announcement-card::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 3px;
        background: var(--primary-color);
    }

    .announcement-title {
        margin: 0;
        padding-left: 8px;
        font-size: 19px;
        font-weight: 750;
        overflow-wrap: anywhere;
    }

    .announcement-content {
        margin-top: 10px;
        padding-left: 8px;
        color: var(--muted-text);
        line-height: 1.6;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
    }

    .announcement-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        margin-top: 15px;
        padding-left: 8px;
    }

    .announcement-meta span {
        padding: 6px 9px;
        border-radius: 9px;
        background: rgba(255,255,255,.05);
        color: var(--muted-text);
        font-size: 12px;
    }

    .empty-state {
        padding: 34px 18px;
        border: 1px dashed var(--border-color);
        border-radius: 18px;
        color: var(--muted-text);
        text-align: center;
    }

    @media (max-width: 600px) {
        .page-content {
            padding-top: 18px;
        }

        .page-hero {
            padding: 21px 17px;
            border-radius: 19px;
        }

        .announcement-card {
            padding: 17px;
            border-radius: 17px;
        }

        .announcement-title,
        .announcement-content,
        .announcement-meta {
            padding-left: 6px;
        }
    }
</style><script>
(function () {
    "use strict";

    const statusElement = document.getElementById("announcementStatus");
    const listElement = document.getElementById("announcementList");

    function escapeHtml(value) {
        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function showStatus(message, isError) {
        statusElement.textContent = message;
        statusElement.classList.toggle("error-state", Boolean(isError));
        statusElement.style.display = "block";
    }

    function formatDate(value) {
        if (!value) {
            return "Дата не вказана";
        }

        const date = new Date(value);

        if (Number.isNaN(date.getTime())) {
            return "Дата не вказана";
        }

        return date.toLocaleDateString("uk-UA", {
            day: "2-digit",
            month: "2-digit",
            year: "numeric"
        });
    }

    function renderAnnouncements(data) {
        listElement.innerHTML = "";

        if (!Array.isArray(data) || data.length === 0) {
            statusElement.style.display = "none";

            listElement.innerHTML = `
                <div class="empty-state">
                    📭 Поки що немає оголошень.
                </div>
            `;

            return;
        }

        statusElement.style.display = "none";

        data.forEach(item => {
            const card = document.createElement("article");
            card.className = "announcement-card";

            const title = escapeHtml(
                item.title || "Оголошення без назви"
            );

            const content = escapeHtml(
                item.content || "Текст оголошення відсутній."
            );

            const audience = escapeHtml(
                item.audience || "Усі"
            );

            card.innerHTML = `
                <h2 class="announcement-title">
                    ${title}
                </h2>

                <div class="announcement-content">
                    ${content}
                </div>

                <div class="announcement-meta">
                    <span>📢 ${audience}</span>
                    <span>📅 ${formatDate(item.created_at)}</span>
                </div>
            `;

            listElement.appendChild(card);
        });
    }

    async function loadAnnouncements() {
        listElement.innerHTML = "";

        if (
            typeof window.supabaseClient === "undefined" ||
            !window.supabaseClient
        ) {
            showStatus(
                "Не вдалося підключити Supabase. Перевір файл supabase.js.",
                true
            );
            return;
        }

        showStatus("Завантаження оголошень...", false);

        try {
            const { data, error } = await window.supabaseClient
                .from("announcements")
                .select("id,title,content,audience,created_at,updated_at")
                .order("created_at", { ascending: false });

            if (error) {
                console.error("Announcements Supabase error:", error);

                showStatus(
                    "Не вдалося завантажити оголошення. Перевір таблицю announcements та RLS-політики у Supabase.",
                    true
                );

                listElement.innerHTML = `
                    <div class="empty-state error-state">
                        ⚠️ Supabase не дозволив отримати дані з таблиці announcements.
                    </div>
                `;

                return;
            }

            renderAnnouncements(data || []);

        } catch (error) {
            console.error("Announcements loading error:", error);

            showStatus(
                "Сталася помилка під час завантаження оголошень.",
                true
            );
        }
    }

    document.addEventListener("DOMContentLoaded", function () {
        loadAnnouncements();
    });

    if (document.readyState !== "loading") {
        loadAnnouncements();
    }
})();
</script></body>
</html>
