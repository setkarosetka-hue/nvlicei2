<!DOCTYPE html><html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Оголошення — Ліцей №2</title>

<link rel="stylesheet" href="style.css">
<script src="supabase.js"></script>
<script src="app.js" defer></script>

<style>
    body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, sans-serif;
        background:
            radial-gradient(circle at 15% 10%, rgba(80,120,255,.18), transparent 30%),
            radial-gradient(circle at 85% 20%, rgba(0,220,255,.12), transparent 28%),
            #070b14;
        color: #fff;
    }

    .announcements-page {
        width: min(1100px, calc(100% - 28px));
        margin: auto;
        padding: 24px 0 50px;
    }

    .page-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 15px;
        margin-bottom: 22px;
    }

    .back-button {
        color: #fff;
        text-decoration: none;
        padding: 11px 16px;
        border-radius: 14px;
        background: rgba(255,255,255,.07);
        border: 1px solid rgba(255,255,255,.1);
    }

    .hero {
        padding: 28px;
        border-radius: 28px;
        background: linear-gradient(
            135deg,
            rgba(45,105,255,.2),
            rgba(0,220,255,.08)
        );
        border: 1px solid rgba(255,255,255,.1);
        margin-bottom: 22px;
    }

    .hero h1 {
        margin: 0 0 8px;
        font-size: clamp(28px, 6vw, 44px);
    }

    .hero p {
        margin: 0;
        color: #aebbd1;
        line-height: 1.5;
    }

    .announcements-list {
        display: grid;
        gap: 16px;
    }

    .announcement-card {
        position: relative;
        padding: 23px;
        border-radius: 22px;
        background: rgba(255,255,255,.055);
        border: 1px solid rgba(255,255,255,.09);
        box-shadow: 0 12px 40px rgba(0,0,0,.18);
        overflow: hidden;
    }

    .announcement-card::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 4px;
        background: linear-gradient(
            180deg,
            #2777ff,
            #15c9ff
        );
    }

    .announcement-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 15px;
    }

    .announcement-title {
        font-size: 21px;
        font-weight: 800;
        margin-bottom: 7px;
    }

    .announcement-date {
        color: #8f9caf;
        font-size: 13px;
        white-space: nowrap;
    }

    .announcement-content {
        margin-top: 15px;
        color: #c0cad9;
        line-height: 1.65;
        white-space: pre-wrap;
    }

    .announcement-audience {
        display: inline-flex;
        margin-top: 16px;
        padding: 7px 10px;
        border-radius: 9px;
        background: rgba(39,119,255,.12);
        color: #73baff;
        font-size: 12px;
        font-weight: 700;
    }

    .empty,
    .loading,
    .error {
        padding: 35px 20px;
        text-align: center;
        border-radius: 22px;
        background: rgba(255,255,255,.045);
        border: 1px solid rgba(255,255,255,.08);
        color: #aeb9ca;
    }

    .error {
        color: #ff9e9e;
    }

    @media (max-width: 650px) {
        .announcements-page {
            width: calc(100% - 18px);
            padding-top: 14px;
        }

        .page-header {
            flex-direction: column;
            align-items: stretch;
        }

        .hero {
            padding: 22px;
            border-radius: 22px;
        }

        .announcement-card {
            padding: 19px;
        }

        .announcement-top {
            flex-direction: column;
            gap: 5px;
        }

        .announcement-date {
            white-space: normal;
        }
    }
</style>

</head><body><main class="announcements-page"><div class="page-header">

    <a class="back-button" href="dashboard.html">
        ← Назад
    </a>

    <div data-user-name>
        Користувач
    </div>

</div>

<section class="hero">

    <h1>📢 Оголошення</h1>

    <p>
        Важливі повідомлення та новини
        для учнів, батьків, вчителів і всієї
        спільноти ліцею.
    </p>

</section>

<section id="announcementsList" class="announcements-list">

    <div class="loading">
        Завантаження оголошень...
    </div>

</section>

</main><script>

    function escapeHtml(value) {
        return String(value ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    function formatDate(value) {

        if (!value) {
            return 'Дата не вказана';
        }

        const date = new Date(value);

        if (Number.isNaN(date.getTime())) {
            return value;
        }

        return date.toLocaleString('uk-UA', {
            day: '2-digit',
            month: 'long',
            year: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
        });
    }

    function getAudience(role) {

        switch (role) {

            case 'teacher':
                return 'teachers';

            case 'student':
                return 'students';

            case 'parent':
                return 'parents';

            case 'admin':
                return 'all';

            default:
                return null;
        }
    }

    function getAudienceName(audience) {

        switch (audience) {

            case 'teachers':
                return 'Для вчителів';

            case 'students':
                return 'Для учнів';

            case 'parents':
                return 'Для батьків';

            case 'all':
                return 'Для всіх';

            default:
                return audience || 'Загальне';
        }
    }

    async function loadAnnouncements() {

        const container =
            document.getElementById(
                'announcementsList'
            );

        try {

            if (
                typeof supabaseClient ===
                'undefined'
            ) {
                throw new Error(
                    'Supabase не підключено.'
                );
            }

            const profile =
                await getCurrentProfile();

            if (!profile) {

                location.href =
                    'login.html';

                return;
            }

            const audience =
                getAudience(profile.role);

            if (!audience) {
                throw new Error(
                    'Невідома роль користувача.'
                );
            }

            const {
                data,
                error
            } = await supabaseClient
                .from('announcements')
                .select('*')
                .or(
                    `audience.eq.all,audience.eq.${audience}`
                )
                .order('created_at', {
                    ascending: false
                });

            if (error) {
                throw error;
            }

            const announcements =
                data || [];

            if (!announcements.length) {

                container.innerHTML = `
                    <div class="empty">

                        <div style="
                            font-size:38px;
                            margin-bottom:10px;
                        ">
                            📭
                        </div>

                        <div>
                            Оголошень поки немає.
                        </div>

                    </div>
                `;

                return;
            }

            container.innerHTML =
                announcements.map(
                    announcement => `

                    <article
                        class="announcement-card"
                    >

                        <div class="announcement-top">

                            <div>

                                <div class="
                                    announcement-title
                                ">
                                    ${escapeHtml(
                                        announcement.title ||
                                        'Оголошення'
                                    )}
                                </div>

                            </div>

                            <div class="
                                announcement-date
                            ">
                                ${escapeHtml(
                                    formatDate(
                                        announcement.created_at
                                    )
                                )}
                            </div>

                        </div>

                        <div class="
                            announcement-content
                        ">
                            ${escapeHtml(
                                announcement.content ||
                                'Текст оголошення відсутній.'
                            )}
                        </div>

                        <div class="
                            announcement-audience
                        ">
                            📢 ${escapeHtml(
                                getAudienceName(
                                    announcement.audience
                                )
                            )}
                        </div>

                    </article>

                `
                ).join('');

        } catch (error) {

            console.error(
                'Announcements loading error:',
                error
            );

            container.innerHTML = `
                <div class="error">

                    Не вдалося завантажити
                    оголошення.<br>

                    Перевір таблицю
                    announcements та RLS-політики
                    у Supabase.

                </div>
            `;
        }
    }

    document.addEventListener(
        'DOMContentLoaded',
        loadAnnouncements
    );

</script></body>
</html>
