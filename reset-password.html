<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Відновлення пароля — Ліцей №2</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>

  <style>
    :root {
      --bg: #07111f;
      --bg2: #0d1b2e;
      --card: rgba(17, 31, 52, 0.82);
      --border: rgba(255, 255, 255, 0.1);
      --text: #f5f8ff;
      --muted: #9eacc2;
      --primary: #4f8cff;
      --primary2: #7c5cff;
      --success: #31d69b;
      --danger: #ff667d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 15%, rgba(79, 140, 255, 0.25), transparent 35%),
        radial-gradient(circle at 85% 80%, rgba(124, 92, 255, 0.2), transparent 35%),
        linear-gradient(145deg, var(--bg), var(--bg2));
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .background-glow {
      position: fixed;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: rgba(79, 140, 255, 0.12);
      filter: blur(80px);
      pointer-events: none;
      top: 5%;
      left: 5%;
    }

    .background-glow.second {
      background: rgba(124, 92, 255, 0.12);
      top: auto;
      left: auto;
      right: 5%;
      bottom: 5%;
    }

    .container {
      width: 100%;
      max-width: 460px;
      position: relative;
      z-index: 2;
    }

    .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 18px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary), var(--primary2));
      box-shadow: 0 15px 40px rgba(79, 140, 255, 0.3);
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 32px;
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: 28px;
      letter-spacing: -0.5px;
    }

    .description {
      margin: 10px 0 28px;
      text-align: center;
      color: var(--muted);
      line-height: 1.55;
      font-size: 15px;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 600;
    }

    .input-wrapper {
      position: relative;
    }

    input {
      width: 100%;
      height: 52px;
      border: 1px solid var(--border);
      border-radius: 15px;
      outline: none;
      padding: 0 15px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      font-size: 16px;
      transition: 0.2s ease;
    }

    input:focus {
      border-color: rgba(79, 140, 255, 0.8);
      box-shadow: 0 0 0 4px rgba(79, 140, 255, 0.12);
    }

    input::placeholder {
      color: #74829a;
    }

    .password-toggle {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      padding: 8px;
    }

    .requirements {
      margin: -5px 0 20px;
      padding: 13px 15px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.04);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    button.submit {
      width: 100%;
      height: 54px;
      border: 0;
      border-radius: 16px;
      cursor: pointer;
      color: white;
      font-size: 16px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--primary), var(--primary2));
      box-shadow: 0 12px 30px rgba(79, 140, 255, 0.22);
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    button.submit:hover {
      transform: translateY(-1px);
    }

    button.submit:disabled {
      opacity: 0.6;
      cursor: wait;
      transform: none;
    }

    .message {
      display: none;
      margin-bottom: 20px;
      padding: 13px 15px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.5;
    }

    .message.error {
      display: block;
      color: #ffdce1;
      background: rgba(255, 102, 125, 0.12);
      border: 1px solid rgba(255, 102, 125, 0.25);
    }

    .message.success {
      display: block;
      color: #caffeb;
      background: rgba(49, 214, 155, 0.1);
      border: 1px solid rgba(49, 214, 155, 0.25);
    }

    .back {
      display: block;
      margin-top: 22px;
      text-align: center;
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
    }

    .back:hover {
      color: white;
    }

    .loading {
      text-align: center;
      color: var(--muted);
      padding: 20px 0;
    }

    @media (max-width: 520px) {
      body {
        padding: 14px;
      }

      .card {
        padding: 25px 20px;
        border-radius: 23px;
      }

      h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <div class="background-glow"></div>
  <div class="background-glow second"></div>

  <main class="container">

    <div class="logo">Л2</div>

    <section class="card">

      <h1>Новий пароль</h1>

      <p class="description">
        Введіть новий пароль для свого облікового запису Ліцей №2.
      </p>

      <div id="loading" class="loading">
        Перевіряємо посилання для відновлення…
      </div>

      <div id="formArea" style="display:none;">

        <div id="message" class="message"></div>

        <form id="resetForm">

          <div class="field">
            <label for="password">Новий пароль</label>

            <div class="input-wrapper">
              <input
                id="password"
                type="password"
                placeholder="Введіть новий пароль"
                autocomplete="new-password"
                minlength="6"
                required
              >

              <button
                type="button"
                class="password-toggle"
                id="togglePassword"
              >
                Показати
              </button>
            </div>
          </div>

          <div class="field">
            <label for="passwordConfirm">Підтвердження пароля</label>

            <div class="input-wrapper">
              <input
                id="passwordConfirm"
                type="password"
                placeholder="Повторіть новий пароль"
                autocomplete="new-password"
                minlength="6"
                required
              >

              <button
                type="button"
                class="password-toggle"
                id="togglePasswordConfirm"
              >
                Показати
              </button>
            </div>
          </div>

          <div class="requirements">
            Пароль повинен містити щонайменше 6 символів.
          </div>

          <button
            class="submit"
            id="submitButton"
            type="submit"
          >
            Змінити пароль
          </button>

        </form>

        <a class="back" href="login.html">
          ← Повернутися до входу
        </a>

      </div>

    </section>

  </main>

  <script>
    const loading = document.getElementById("loading");
    const formArea = document.getElementById("formArea");
    const message = document.getElementById("message");
    const resetForm = document.getElementById("resetForm");
    const submitButton = document.getElementById("submitButton");

    function showMessage(text, type) {
      message.textContent = text;
      message.className = "message " + type;
    }

    function showPassword(inputId, buttonId) {
      const input = document.getElementById(inputId);
      const button = document.getElementById(buttonId);

      button.addEventListener("click", () => {
        if (input.type === "password") {
          input.type = "text";
          button.textContent = "Сховати";
        } else {
          input.type = "password";
          button.textContent = "Показати";
        }
      });
    }

    showPassword("password", "togglePassword");
    showPassword("passwordConfirm", "togglePasswordConfirm");

    async function initializeReset() {
      try {
        const { data: sessionData } =
          await supabaseClient.auth.getSession();

        if (sessionData && sessionData.session) {
          loading.style.display = "none";
          formArea.style.display = "block";
          return;
        }

        const hash = window.location.hash;

        if (!hash || !hash.includes("access_token")) {
          loading.style.display = "none";
          formArea.style.display = "block";

          showMessage(
            "Посилання для відновлення пароля недійсне або вже використане. Запросіть нове посилання.",
            "error"
          );

          submitButton.disabled = true;
          return;
        }

        loading.style.display = "none";
        formArea.style.display = "block";

      } catch (error) {
        console.error(error);

        loading.style.display = "none";
        formArea.style.display = "block";

        showMessage(
          "Не вдалося перевірити посилання для відновлення.",
          "error"
        );

        submitButton.disabled = true;
      }
    }

    resetForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const password =
        document.getElementById("password").value;

      const passwordConfirm =
        document.getElementById("passwordConfirm").value;

      if (password.length < 6) {
        showMessage(
          "Пароль повинен містити щонайменше 6 символів.",
          "error"
        );
        return;
      }

      if (password !== passwordConfirm) {
        showMessage(
          "Паролі не збігаються.",
          "error"
        );
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = "Змінюємо пароль…";

      try {
        const { error } =
          await supabaseClient.auth.updateUser({
            password: password
          });

        if (error) {
          console.error(error);

          showMessage(
            "Не вдалося змінити пароль: " + error.message,
            "error"
          );

          submitButton.disabled = false;
          submitButton.textContent = "Змінити пароль";
          return;
        }

        showMessage(
          "Пароль успішно змінено! Зараз ви будете перенаправлені на сторінку входу.",
          "success"
        );

        setTimeout(async () => {
          await supabaseClient.auth.signOut();
          window.location.href = "login.html";
        }, 1800);

      } catch (error) {
        console.error(error);

        showMessage(
          "Сталася помилка під час зміни пароля.",
          "error"
        );

        submitButton.disabled = false;
        submitButton.textContent = "Змінити пароль";
      }
    });

    initializeReset();
  </script>

</body>
</html>
