<!DOCTYPE html><html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#07111f">

<title>Підтвердження пошти — Ліцей №2</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="app.js" defer></script>

</head><body class="auth-page"><div class="page-background"></div>

<main class="auth-container">

    <div class="auth-brand">
        <span class="auth-brand-mark">Л2</span>

        <div>
            <strong>Ліцей №2</strong>
            <span>Цифрова система ліцею</span>
        </div>
    </div>

    <section class="auth-card verify-card">

        <div class="verify-icon">
            ✓
        </div>

        <span class="eyebrow">
            ЕЛЕКТРОННА ПОШТА
        </span>

        <h1 id="verifyTitle">
            Підтвердження пошти
        </h1>

        <p id="verifyText">
            Перевіряємо підтвердження вашої електронної пошти.
        </p>

        <div class="verify-status" id="verifyStatus">
            <span class="status-dot"></span>
            <span>Перевірка...</span>
        </div>

        <a
            href="login.html"
            class="primary-button"
            id="loginButton"
            hidden
        >
            Перейти до входу
        </a>

        <a
            href="index.html"
            class="auth-back-link"
        >
            ← На головну
        </a>

    </section>

    <p class="auth-footer">
        © <span id="currentYear"></span> Ліцей №2
    </p>

</main>

<script>
    document.addEventListener('DOMContentLoaded', async () => {

        const title =
            document.getElementById('verifyTitle');

        const text =
            document.getElementById('verifyText');

        const status =
            document.getElementById('verifyStatus');

        const loginButton =
            document.getElementById('loginButton');

        function showSuccess() {

            title.textContent =
                'Пошту підтверджено';

            text.textContent =
                'Електронну адресу успішно підтверджено. Тепер ви можете увійти до системи.';

            status.innerHTML =
                '<span class="status-dot success"></span><span>Підтвердження успішне</span>';

            loginButton.hidden = false;
        }

        function showError(message) {

            title.textContent =
                'Потрібно підтвердити пошту';

            text.textContent =
                message;

            status.innerHTML =
                '<span class="status-dot error"></span><span>Підтвердження не завершено</span>';

            loginButton.hidden = false;
        }

        try {

            if (
                typeof supabaseClient === 'undefined' ||
                !supabaseClient?.auth
            ) {
                showError(
                    'Не вдалося підключитися до системи. Спробуйте відкрити сторінку ще раз.'
                );
                return;
            }

            const url =
                new URL(window.location.href);

            const code =
                url.searchParams.get('code');

            if (code) {

                const {
                    error
                } = await supabaseClient.auth.exchangeCodeForSession(code);

                if (error) {
                    console.error(
                        'Email verification error:',
                        error
                    );

                    showError(
                        'Посилання для підтвердження недійсне або вже використане.'
                    );

                    return;
                }

                showSuccess();
                return;
            }

            const {
                data,
                error
            } = await supabaseClient.auth.getSession();

            if (error) {
                console.error(
                    'Session error:',
                    error
                );

                showError(
                    'Не вдалося перевірити підтвердження пошти.'
                );

                return;
            }

            if (data?.session?.user?.email_confirmed_at) {

                showSuccess();

            } else {

                showError(
                    'Відкрийте посилання з листа, який було надіслано на вашу електронну адресу.'
                );
            }

        } catch (error) {

            console.error(
                'Verification error:',
                error
            );

            showError(
                'Сталася помилка під час підтвердження. Спробуйте ще раз.'
            );
        }
    });
</script>

</body>
</html>
