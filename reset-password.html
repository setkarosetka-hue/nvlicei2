<!DOCTYPE html><html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#07111f">

<title>Відновлення пароля — Ліцей №2</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="app.js" defer></script>

</head><body class="auth-page"><div class="page-background"></div>

<main class="auth-container">

    <div class="auth-brand">
        <span class="auth-brand-mark">Л2</span>

        <div>
            <strong>Ліцей №2</strong>
            <span>Цифрова система ліцею</span>
        </div>
    </div>

    <section class="auth-card">

        <div class="verify-icon">
            🔐
        </div>

        <span class="eyebrow">
            БЕЗПЕКА АКАУНТА
        </span>

        <h1>
            Новий пароль
        </h1>

        <p class="auth-description">
            Введіть новий пароль для вашого акаунта.
        </p>

        <form id="resetPasswordForm" class="auth-form">

            <div class="form-group">
                <label for="newPassword">
                    Новий пароль
                </label>

                <div class="password-field">
                    <input
                        type="password"
                        id="newPassword"
                        name="password"
                        placeholder="Введіть новий пароль"
                        minlength="6"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        id="togglePassword"
                        aria-label="Показати пароль"
                    >
                        👁
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">
                    Повторіть пароль
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    placeholder="Повторіть новий пароль"
                    minlength="6"
                    autocomplete="new-password"
                    required
                >
            </div>

            <button
                type="submit"
                class="primary-button"
                id="resetButton"
            >
                Змінити пароль
            </button>

        </form>

        <div
            class="auth-message"
            id="resetMessage"
            hidden
        ></div>

        <a
            href="login.html"
            class="auth-back-link"
        >
            ← Повернутися до входу
        </a>

    </section>

    <p class="auth-footer">
        © <span id="currentYear"></span> Ліцей №2
    </p>

</main>

<script>
    document.addEventListener('DOMContentLoaded', async () => {

        const form =
            document.getElementById('resetPasswordForm');

        const password =
            document.getElementById('newPassword');

        const confirmPassword =
            document.getElementById('confirmPassword');

        const button =
            document.getElementById('resetButton');

        const message =
            document.getElementById('resetMessage');

        const toggle =
            document.getElementById('togglePassword');

        function showMessage(text, type = 'info') {

            message.hidden = false;
            message.textContent = text;

            message.classList.remove(
                'success',
                'error',
                'info'
            );

            message.classList.add(type);
        }

        toggle.addEventListener('click', () => {

            const isPassword =
                password.type === 'password';

            password.type =
                isPassword ? 'text' : 'password';

            confirmPassword.type =
                isPassword ? 'text' : 'password';

            toggle.textContent =
                isPassword ? '🙈' : '👁';
        });

        if (
            typeof supabaseClient === 'undefined' ||
            !supabaseClient?.auth
        ) {
            showMessage(
                'Не вдалося підключитися до системи.',
                'error'
            );

            return;
        }

        try {

            const {
                data,
                error
            } = await supabaseClient.auth.getSession();

            if (error || !data?.session) {

                showMessage(
                    'Посилання для відновлення пароля недійсне або термін його дії минув.',
                    'error'
                );

                button.disabled = true;

                return;
            }

        } catch (error) {

            console.error(
                'Password reset session error:',
                error
            );

            showMessage(
                'Не вдалося перевірити посилання для відновлення.',
                'error'
            );

            button.disabled = true;

            return;
        }

        form.addEventListener('submit', async (event) => {

            event.preventDefault();

            const newPassword =
                password.value.trim();

            const repeatedPassword =
                confirmPassword.value.trim();

            if (newPassword.length < 6) {

                showMessage(
                    'Пароль має містити щонайменше 6 символів.',
                    'error'
                );

                return;
            }

            if (newPassword !== repeatedPassword) {

                showMessage(
                    'Паролі не збігаються.',
                    'error'
                );

                return;
            }

            button.disabled = true;
            button.textContent = 'Збереження...';

            try {

                const {
                    error
                } = await supabaseClient.auth.updateUser({
                    password: newPassword
                });

                if (error) {

                    console.error(
                        'Password update error:',
                        error
                    );

                    showMessage(
                        error.message ||
                        'Не вдалося змінити пароль.',
                        'error'
                    );

                    button.disabled = false;
                    button.textContent =
                        'Змінити пароль';

                    return;
                }

                showMessage(
                    'Пароль успішно змінено. Зараз ви будете перенаправлені на сторінку входу.',
                    'success'
                );

                await supabaseClient.auth.signOut();

                setTimeout(() => {
                    window.location.href =
                        'login.html';
                }, 1800);

            } catch (error) {

                console.error(
                    'Password update error:',
                    error
                );

                showMessage(
                    'Сталася помилка. Спробуйте ще раз.',
                    'error'
                );

                button.disabled = false;
                button.textContent =
                    'Змінити пароль';
            }
        });
    });
</script>

</body>
</html>
