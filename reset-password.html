<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Новий пароль — Ліцей №2</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>

  <style>
    :root {
      --bg:#07111f;
      --bg2:#0d1b2e;
      --card:rgba(17,31,52,.88);
      --border:rgba(255,255,255,.1);
      --text:#f5f8ff;
      --muted:#9eacc2;
      --primary:#4f8cff;
      --primary2:#7c5cff;
      --success:#31d69b;
      --danger:#ff667d;
    }

    * {
      box-sizing:border-box;
    }

    body {
      margin:0;
      min-height:100vh;
      padding:18px;
      display:flex;
      align-items:center;
      justify-content:center;
      color:var(--text);
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:
        radial-gradient(circle at 15% 15%,rgba(79,140,255,.25),transparent 35%),
        radial-gradient(circle at 85% 85%,rgba(124,92,255,.2),transparent 35%),
        linear-gradient(145deg,var(--bg),var(--bg2));
    }

    .container {
      width:100%;
      max-width:460px;
    }

    .logo {
      width:66px;
      height:66px;
      margin:0 auto 18px;
      display:flex;
      align-items:center;
      justify-content:center;
      border-radius:21px;
      font-size:25px;
      font-weight:800;
      background:linear-gradient(135deg,var(--primary),var(--primary2));
      box-shadow:0 18px 45px rgba(79,140,255,.3);
    }

    .card {
      padding:31px;
      border:1px solid var(--border);
      border-radius:28px;
      background:var(--card);
      backdrop-filter:blur(24px);
      -webkit-backdrop-filter:blur(24px);
      box-shadow:0 30px 80px rgba(0,0,0,.4);
    }

    h1 {
      margin:0;
      text-align:center;
      font-size:28px;
    }

    .description {
      margin:10px 0 26px;
      color:var(--muted);
      text-align:center;
      line-height:1.55;
      font-size:14px;
    }

    .field {
      margin-bottom:17px;
    }

    label {
      display:block;
      margin-bottom:8px;
      font-size:13px;
      font-weight:700;
    }

    .password {
      position:relative;
    }

    input {
      width:100%;
      height:52px;
      padding:0 82px 0 15px;
      border:1px solid var(--border);
      border-radius:15px;
      outline:none;
      color:var(--text);
      background:rgba(255,255,255,.055);
      font-size:15px;
    }

    input:focus {
      border-color:rgba(79,140,255,.8);
      box-shadow:0 0 0 4px rgba(79,140,255,.1);
    }

    .show {
      position:absolute;
      right:8px;
      top:50%;
      transform:translateY(-50%);
      border:0;
      color:var(--muted);
      background:transparent;
      cursor:pointer;
      font-size:12px;
    }

    .submit {
      width:100%;
      height:53px;
      margin-top:5px;
      border:0;
      border-radius:15px;
      color:white;
      background:linear-gradient(135deg,var(--primary),var(--primary2));
      box-shadow:0 13px 32px rgba(79,140,255,.22);
      cursor:pointer;
      font-size:15px;
      font-weight:800;
    }

    .submit:disabled {
      opacity:.55;
      cursor:wait;
    }

    .message {
      display:none;
      margin-bottom:18px;
      padding:13px 14px;
      border-radius:14px;
      font-size:13px;
      line-height:1.5;
    }

    .message.error {
      display:block;
      color:#ffdce1;
      background:rgba(255,102,125,.1);
      border:1px solid rgba(255,102,125,.25);
    }

    .message.success {
      display:block;
      color:#caffeb;
      background:rgba(49,214,155,.1);
      border:1px solid rgba(49,214,155,.25);
    }

    .loading {
      padding:20px 0;
      color:var(--muted);
      text-align:center;
    }

    .back {
      display:block;
      margin-top:20px;
      color:var(--muted);
      text-align:center;
      text-decoration:none;
      font-size:13px;
    }

    .back:hover {
      color:white;
    }

    .hidden {
      display:none!important;
    }

    @media(max-width:480px) {
      .card {
        padding:24px 19px;
        border-radius:23px;
      }

      h1 {
        font-size:24px;
      }
    }
  </style>
</head>

<body>

<main class="container">

  <div class="logo">Л2</div>

  <section class="card">

    <div id="loading" class="loading">
      Перевіряємо посилання…
    </div>

    <div id="content" class="hidden">

      <h1>Новий пароль</h1>

      <p class="description">
        Введіть новий пароль для свого облікового запису.
      </p>

      <div id="message" class="message"></div>

      <form id="passwordForm">

        <div class="field">
          <label for="password">Новий пароль</label>

          <div class="password">
            <input
              id="password"
              type="password"
              minlength="6"
              autocomplete="new-password"
              placeholder="Мінімум 6 символів"
              required
            >

            <button
              type="button"
              class="show"
              data-target="password"
            >
              Показати
            </button>
          </div>
        </div>

        <div class="field">
          <label for="confirmPassword">
            Підтвердження пароля
          </label>

          <div class="password">
            <input
              id="confirmPassword"
              type="password"
              minlength="6"
              autocomplete="new-password"
              placeholder="Повторіть пароль"
              required
            >

            <button
              type="button"
              class="show"
              data-target="confirmPassword"
            >
              Показати
            </button>
          </div>
        </div>

        <button
          id="submitButton"
          class="submit"
          type="submit"
        >
          Зберегти новий пароль
        </button>

      </form>

      <a class="back" href="login.html">
        ← Повернутися до входу
      </a>

    </div>

  </section>

</main>

<script>

  const loading =
    document.getElementById("loading");

  const content =
    document.getElementById("content");

  const message =
    document.getElementById("message");

  const form =
    document.getElementById("passwordForm");

  const submitButton =
    document.getElementById("submitButton");


  function showMessage(text,type) {

    message.textContent = text;
    message.className = "message " + type;

  }


  document.querySelectorAll(".show").forEach(button => {

    button.addEventListener("click", () => {

      const input =
        document.getElementById(button.dataset.target);

      if (input.type === "password") {

        input.type = "text";
        button.textContent = "Сховати";

      } else {

        input.type = "password";
        button.textContent = "Показати";

      }

    });

  });


  async function initializeRecovery() {

    try {

      /*
       * Новый Supabase PKCE flow:
       * /reset-password.html?code=...
       */

      const params =
        new URLSearchParams(window.location.search);

      const code =
        params.get("code");

      if (code) {

        const { error } =
          await supabaseClient.auth.exchangeCodeForSession(code);

        if (error) {
          throw error;
        }

        /*
         * Убираем code из адресной строки,
         * чтобы его случайно не использовать повторно.
         */

        window.history.replaceState(
          {},
          document.title,
          window.location.pathname
        );
      }


      /*
       * Проверяем, появилась ли recovery-сессия.
       */

      const { data, error } =
        await supabaseClient.auth.getSession();

      if (error) {
        throw error;
      }


      if (!data.session) {

        /*
         * Совместимость со старым implicit flow.
         */

        const hash =
          new URLSearchParams(
            window.location.hash.substring(1)
          );

        const accessToken =
          hash.get("access_token");

        const refreshToken =
          hash.get("refresh_token");

        if (accessToken && refreshToken) {

          const { error: sessionError } =
            await supabaseClient.auth.setSession({
              access_token:accessToken,
              refresh_token:refreshToken
            });

          if (sessionError) {
            throw sessionError;
          }

        } else {

          throw new Error(
            "Посилання для відновлення пароля недійсне або вже використане."
          );

        }
      }


      loading.classList.add("hidden");
      content.classList.remove("hidden");


    } catch(error) {

      console.error(
        "Password recovery error:",
        error
      );

      loading.classList.add("hidden");
      content.classList.remove("hidden");

      form.classList.add("hidden");

      showMessage(
        "Посилання для зміни пароля недійсне або вже використане. Запросіть новий лист відновлення.",
        "error"
      );

    }

  }


  form.addEventListener("submit", async event => {

    event.preventDefault();

    const password =
      document.getElementById("password").value;

    const confirmPassword =
      document.getElementById("confirmPassword").value;


    if (password.length < 6) {

      showMessage(
        "Пароль повинен містити щонайменше 6 символів.",
        "error"
      );

      return;
    }


    if (password !== confirmPassword) {

      showMessage(
        "Паролі не збігаються.",
        "error"
      );

      return;
    }


    submitButton.disabled = true;
    submitButton.textContent =
      "Зберігаємо…";


    try {

      const { error } =
        await supabaseClient.auth.updateUser({
          password:password
        });


      if (error) {
        throw error;
      }


      showMessage(
        "Пароль успішно змінено! Зараз відкриється сторінка входу.",
        "success"
      );


      setTimeout(async () => {

        await supabaseClient.auth.signOut();

        window.location.href =
          "login.html";

      },1800);


    } catch(error) {

      console.error(error);

      showMessage(
        "Не вдалося змінити пароль: " +
        error.message,
        "error"
      );

      submitButton.disabled = false;
      submitButton.textContent =
        "Зберегти новий пароль";

    }

  });


  /*
   * Supabase также сообщает PASSWORD_RECOVERY
   * после успешного восстановления.
   */

  supabaseClient.auth.onAuthStateChange(
    (event) => {

      if (event === "PASSWORD_RECOVERY") {

        loading.classList.add("hidden");
        content.classList.remove("hidden");

      }

    }
  );


  initializeRecovery();

</script>

</body>
</html>
