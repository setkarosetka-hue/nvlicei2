<!DOCTYPE html><html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Події — Ліцей №2</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="app.js" defer></script>

<style>
    .events-page {
        width: min(1100px, calc(100% - 24px));
        margin: auto;
        padding: 20px 0 40px;
    }

    .events-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 20px;
        margin-bottom: 18px;
        border-radius: 22px;
        background: rgba(255,255,255,.07);
        border: 1px solid rgba(255,255,255,.1);
    }

    .events-header h1 {
        margin: 0 0 5px;
    }

    .events-header p {
        margin: 0;
        opacity: .65;
    }

    .back-btn {
        padding: 10px 15px;
        border-radius: 13px;
        text-decoration: none;
        color: inherit;
        background: rgba(255,255,255,.09);
        border: 1px solid rgba(255,255,255,.1);
        white-space: nowrap;
    }

    .events-status {
        padding: 14px 17px;
        margin-bottom: 16px;
        border-radius: 16px;
        background: rgba(255,255,255,.06);
        border: 1px solid rgba(255,255,255,.08);
    }

    .events-list {
        display: grid;
        gap: 14px;
    }

    .event-card {
        display: grid;
        grid-template-columns: 90px 1fr;
        gap: 18px;
        padding: 20px;
        border-radius: 21px;
        background: rgba(255,255,255,.065);
        border: 1px solid rgba(255,255,255,.09);
        transition: transform .2s ease, background .2s ease;
    }

    .event-card:hover {
        transform: translateY(-2px);
        background: rgba(255,255,255,.09);
    }

    .event-date-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 90px;
        border-radius: 17px;
        background: rgba(0,170,255,.12);
        border: 1px solid rgba(0,170,255,.15);
        text-align: center;
    }

    .event-day {
        font-size: 29px;
        font-weight: 800;
    }

    .event-month {
        font-size: 12px;
        opacity: .7;
    }

    .event-content h2 {
        margin: 0 0 8px;
        font-size: 20px;
    }

    .event-description {
        margin: 0;
        line-height: 1.55;
        opacity: .76;
        white-space: pre-wrap;
    }

    .event-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 15px;
    }

    .meta {
        padding: 7px 10px;
        border-radius: 10px;
        background: rgba(255,255,255,.06);
        font-size: 12px;
        opacity: .75;
    }

    .empty {
        padding: 42px 20px;
        text-align: center;
        border-radius: 20px;
        background: rgba(255,255,255,.05);
        border: 1px dashed rgba(255,255,255,.12);
    }

    .empty-icon {
        font-size: 42px;
        margin-bottom: 10px;
    }

    .empty p {
        margin: 0;
        opacity: .65;
    }

    .error {
        color: #ffb4b4;
    }

    @media (max-width: 600px) {
        .events-page {
            width: min(100% - 16px, 1100px);
        }

        .events-header {
            padding: 16px;
        }

        .events-header h1 {
            font-size: 24px;
        }

        .back-btn {
            padding: 9px 11px;
            font-size: 13px;
        }

        .event-card {
            grid-template-columns: 1fr;
            gap: 13px;
            padding: 17px;
        }

        .event-date-box {
            min-height: 70px;
            flex-direction: row;
            gap: 8px;
            justify-content: flex-start;
            padding: 0 15px;
        }

        .event-day {
            font-size: 25px;
        }
    }
</style>

</head><body><main class="events-page"><header class="events-header">
    <div>
        <h1>🎉 Події</h1>
        <p>Заходи та події Ліцею №2</p>
    </div>

    <a href="dashboard.html" class="back-btn">
        🏠 Головна
    </a>
</header>

<div id="eventsStatus" class="events-status">
    Завантаження подій...
</div>

<section id="eventsList" class="events-list"></section>

</main><script>
document.addEventListener("DOMContentLoaded", async () => {

    const status = document.getElementById("eventsStatus");
    const list = document.getElementById("eventsList");

    function escapeHTML(value) {
        if (value === null || value === undefined) return "";

        return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }

    function getDateParts(value) {

        if (!value) {
            return {
                day: "—",
                month: "Дата"
            };
        }

        const date = new Date(value);

        if (Number.isNaN(date.getTime())) {
            return {
                day: "—",
                month: escapeHTML(value)
            };
        }

        return {
            day: date.toLocaleDateString("uk-UA", {
                day: "2-digit"
            }),
            month: date.toLocaleDateString("uk-UA", {
                month: "short"
            })
        };
    }

    function formatTime(value) {
        if (!value) return "";

        return escapeHTML(value);
    }

    function renderEvents(events) {

        if (!events || events.length === 0) {

            status.textContent =
                "Запланованих подій поки немає.";

            list.innerHTML = `
                <div class="empty">
                    <div class="empty-icon">🎉</div>
                    <p>Коли буде додано нову подію, вона з'явиться тут.</p>
                </div>
            `;

            return;
        }

        status.textContent =
            `Подій: ${events.length}`;

        list.innerHTML = events.map(event => {

            const date = getDateParts(event.event_date);

            const title =
                escapeHTML(event.title || "Подія");

            const description =
                escapeHTML(event.description || "Опис відсутній.");

            const location =
                event.location
                    ? `📍 ${escapeHTML(event.location)}`
                    : "";

            const time =
                event.start_time
                    ? `🕐 ${formatTime(event.start_time)}`
                    : "";

            const className =
                event.class_name
                    ? `👥 ${escapeHTML(event.class_name)}`
                    : "";

            return `
                <article class="event-card">

                    <div class="event-date-box">
                        <div class="event-day">
                            ${date.day}
                        </div>

                        <div class="event-month">
                            ${date.month}
                        </div>
                    </div>

                    <div class="event-content">

                        <h2>${title}</h2>

                        <p class="event-description">
                            ${description}
                        </p>

                        <div class="event-meta">

                            ${time
                                ? `<span class="meta">${time}</span>`
                                : ""
                            }

                            ${location
                                ? `<span class="meta">${location}</span>`
                                : ""
                            }

                            ${className
                                ? `<span class="meta">${className}</span>`
                                : ""
                            }

                        </div>

                    </div>

                </article>
            `;

        }).join("");
    }

    try {

        if (!window.supabaseClient) {

            status.innerHTML =
                '<span class="error">Не вдалося підключити Supabase. Перевір supabase.js.</span>';

            return;
        }

        const {
            data: events,
            error
        } = await window.supabaseClient
            .from("events")
            .select("*")
            .order("event_date", {
                ascending: true,
                nullsFirst: false
            });

        if (error) {

            console.error("Supabase events error:", error);

            status.innerHTML =
                '<span class="error">Не вдалося завантажити події. Перевір таблицю events та RLS.</span>';

            list.innerHTML = `
                <div class="empty">
                    <div class="empty-icon">⚠️</div>
                    <p>Supabase повернув помилку під час отримання подій.</p>
                </div>
            `;

            return;
        }

        renderEvents(events);

    } catch (error) {

        console.error("Events loading error:", error);

        status.innerHTML =
            '<span class="error">Помилка під час завантаження подій.</span>';
    }

});
</script></body>
</html>
