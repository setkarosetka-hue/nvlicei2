<!DOCTYPE html><html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#07111f"><title>Події — Ліцей №2</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="app.js" defer></script>

</head><body><header class="site-header">
    <div class="container header-inner">    <a href="dashboard.html" class="brand">
        <span class="brand-mark">Л2</span>

        <span class="brand-text">
            <strong>Ліцей №2</strong>
            <small>Події</small>
        </span>
    </a>

    <button
        type="button"
        class="mobile-menu-button"
        id="mobileMenuButton"
        aria-label="Відкрити меню"
        aria-expanded="false">
        ☰
    </button>

    <nav class="main-nav" id="mainNav">
        <a href="dashboard.html">Кабінет</a>
        <a href="schedule.html">Розклад</a>
        <a href="events.html" class="active">Події</a>
        <a href="messages.html">Повідомлення</a>
    </nav>

</div>

</header><main class="container page-content"><section class="page-hero">
    <div>
        <span class="eyebrow">Шкільне життя</span>
        <h1>Події</h1>
        <p>Найближчі заходи, зустрічі та події ліцею.</p>
    </div>
</section>

<section id="eventsStatus" class="status-box">
    Завантаження подій...
</section>

<section id="eventsList" class="events-list"></section>

</main><footer class="site-footer">
    <div class="container">
        <p>© <span id="currentYear"></span> Ліцей №2</p>
    </div>
</footer><style>
    .page-content {
        padding-top: 28px;
        padding-bottom: 48px;
    }

    .page-hero {
        margin-bottom: 20px;
        padding: 26px;
        border: 1px solid var(--border-color);
        border-radius: 22px;
        background:
            radial-gradient(circle at top right, rgba(70, 130, 255, .18), transparent 35%),
            var(--surface-color);
    }

    .page-hero h1 {
        margin: 6px 0 8px;
        font-size: clamp(27px, 5vw, 38px);
    }

    .page-hero p {
        margin: 0;
        color: var(--muted-text);
    }

    .eyebrow {
        color: var(--primary-color);
        font-size: 13px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: .08em;
    }

    .status-box {
        padding: 18px;
        margin-bottom: 14px;
        border: 1px solid var(--border-color);
        border-radius: 16px;
        background: var(--surface-color);
        color: var(--muted-text);
        text-align: center;
    }

    .status-box.error-state {
        color: #ff9d9d;
        border-color: rgba(255, 90, 90, .35);
    }

    .events-list {
        display: grid;
        gap: 14px;
    }

    .event-card {
        display: grid;
        grid-template-columns: 82px minmax(0, 1fr);
        gap: 17px;
        padding: 18px;
        border: 1px solid var(--border-color);
        border-radius: 20px;
        background: var(--surface-color);
        transition: transform .18s ease, border-color .18s ease;
    }

    .event-card:hover {
        transform: translateY(-2px);
        border-color: rgba(100, 150, 255, .35);
    }

    .event-date {
        min-height: 78px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        border-radius: 16px;
        background: rgba(70, 130, 255, .1);
        text-align: center;
    }

    .event-day {
        font-size: 27px;
        font-weight: 800;
        line-height: 1;
    }

    .event-month {
        margin-top: 5px;
        color: var(--muted-text);
        font-size: 12px;
        text-transform: uppercase;
    }

    .event-title {
        margin: 0;
        font-size: 19px;
        font-weight: 750;
    }

    .event-description {
        margin: 8px 0 0;
        color: var(--muted-text);
        line-height: 1.5;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
    }

    .event-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        margin-top: 13px;
    }

    .event-meta span {
        padding: 6px 9px;
        border-radius: 8px;
        background: rgba(255,255,255,.05);
        color: var(--muted-text);
        font-size: 12px;
    }

    .empty-state {
        padding: 36px 18px;
        border: 1px dashed var(--border-color);
        border-radius: 18px;
        color: var(--muted-text);
        text-align: center;
    }

    .error-state {
        color: #ff9d9d;
    }

    @media (max-width: 650px) {
        .page-content {
            padding-top: 18px;
        }

        .page-hero {
            padding: 21px 17px;
            border-radius: 19px;
        }

        .event-card {
            grid-template-columns: 58px minmax(0, 1fr);
            gap: 12px;
            padding: 14px;
            border-radius: 17px;
        }

        .event-date {
            min-height: 64px;
            border-radius: 13px;
        }

        .event-day {
            font-size: 22px;
        }

        .event-month {
            font-size: 10px;
        }

        .event-title {
            font-size: 17px;
        }
    }
</style><script>
(function () {
    "use strict";

    const statusElement = document.getElementById("eventsStatus");
    const listElement = document.getElementById("eventsList");

    function escapeHtml(value) {
        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function showStatus(message, isError) {
        statusElement.textContent = message;
        statusElement.classList.toggle("error-state", Boolean(isError));
        statusElement.style.display = "block";
    }

    function parseDate(value) {
        if (!value) return null;

        const date = new Date(value);

        if (Number.isNaN(date.getTime())) {
            return null;
        }

        return date;
    }

    function renderDate(value) {
        const date = parseDate(value);

        if (!date) {
            return {
                day: "—",
                month: "Дата"
            };
        }

        return {
            day: date.toLocaleDateString("uk-UA", {
                day: "2-digit"
            }),
            month: date.toLocaleDateString("uk-UA", {
                month: "short"
            })
        };
    }

    function formatFullDate(value) {
        const date = parseDate(value);

        if (!date) {
            return "Дата не вказана";
        }

        return date.toLocaleDateString("uk-UA", {
            day: "2-digit",
            month: "long",
            year: "numeric"
        });
    }

    function renderEvents(events) {
        listElement.innerHTML = "";

        if (!events.length) {
            statusElement.style.display = "none";

            listElement.innerHTML = `
                <div class="empty-state">
                    📅 Запланованих подій поки немає.
                </div>
            `;

            return;
        }

        statusElement.style.display = "none";

        events.forEach(item => {
            const dateInfo = renderDate(item.event_date);

            const card = document.createElement("article");
            card.className = "event-card";

            const timeText = item.start_time
                ? `<span>🕐 ${escapeHtml(item.start_time)}</span>`
                : "";

            const locationText = item.location
                ? `<span>📍 ${escapeHtml(item.location)}</span>`
                : "";

            const classText = item.class_name
                ? `<span>👥 ${escapeHtml(item.class_name)}</span>`
                : "";

            card.innerHTML = `
                <div class="event-date">
                    <div class="event-day">
                        ${escapeHtml(dateInfo.day)}
                    </div>

                    <div class="event-month">
                        ${escapeHtml(dateInfo.month)}
                    </div>
                </div>

                <div>
                    <h2 class="event-title">
                        ${escapeHtml(item.title || "Подія")}
                    </h2>

                    <div class="event-description">
                        ${escapeHtml(item.description || "")}
                    </div>

                    <div class="event-meta">
                        <span>📅 ${escapeHtml(formatFullDate(item.event_date))}</span>
                        ${timeText}
                        ${locationText}
                        ${classText}
                    </div>
                </div>
            `;

            listElement.appendChild(card);
        });
    }

    async function loadEvents() {
        listElement.innerHTML = "";

        if (
            typeof window.supabaseClient === "undefined" ||
            !window.supabaseClient
        ) {
            showStatus(
                "Не вдалося підключити Supabase. Перевір файл supabase.js.",
                true
            );
            return;
        }

        showStatus("Завантаження подій...", false);

        try {
            const { data, error } = await window.supabaseClient
                .from("events")
                .select("*")
                .order("event_date", { ascending: true });

            if (error) {
                console.error("Events Supabase error:", error);

                showStatus(
                    "Не вдалося завантажити події. Перевір таблицю events у Supabase.",
                    true
                );

                listElement.innerHTML = `
                    <div class="empty-state error-state">
                        ⚠️ Supabase не дозволив отримати дані з таблиці events.
                    </div>
                `;

                return;
            }

            renderEvents(Array.isArray(data) ? data : []);

        } catch (error) {
            console.error("Events loading error:", error);

            showStatus(
                "Сталася помилка під час завантаження подій.",
                true
            );
        }
    }

    document.addEventListener("DOMContentLoaded", function () {
        loadEvents();
    });

    if (document.readyState !== "loading") {
        loadEvents();
    }
})();
</script></body>
</html>
