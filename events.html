<!DOCTYPE html><html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Події — Ліцей №2</title><link rel="stylesheet" href="style.css">
<script src="supabase.js"></script>
<script src="app.js" defer></script>

<style>
    body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, sans-serif;
        background:
            radial-gradient(circle at 15% 10%, rgba(80,120,255,.18), transparent 30%),
            radial-gradient(circle at 85% 20%, rgba(0,220,255,.12), transparent 28%),
            #070b14;
        color: #fff;
    }

    .events-page {
        width: min(1100px, calc(100% - 28px));
        margin: auto;
        padding: 24px 0 50px;
    }

    .events-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 15px;
        margin-bottom: 22px;
    }

    .back-button {
        color: #fff;
        text-decoration: none;
        padding: 11px 16px;
        border-radius: 14px;
        background: rgba(255,255,255,.07);
        border: 1px solid rgba(255,255,255,.1);
    }

    .hero {
        padding: 28px;
        border-radius: 28px;
        background: linear-gradient(135deg, rgba(45,105,255,.2), rgba(0,220,255,.08));
        border: 1px solid rgba(255,255,255,.1);
        margin-bottom: 22px;
    }

    .hero h1 {
        margin: 0 0 8px;
        font-size: clamp(28px, 6vw, 44px);
    }

    .hero p {
        margin: 0;
        color: #aebbd1;
        line-height: 1.5;
    }

    .filters {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 20px;
    }

    .filter-button {
        border: 1px solid rgba(255,255,255,.1);
        background: rgba(255,255,255,.06);
        color: #fff;
        padding: 11px 16px;
        border-radius: 13px;
        cursor: pointer;
    }

    .filter-button.active {
        background: #2777ff;
        border-color: #2777ff;
    }

    .events-list {
        display: grid;
        gap: 16px;
    }

    .event-card {
        padding: 22px;
        border-radius: 22px;
        background: rgba(255,255,255,.055);
        border: 1px solid rgba(255,255,255,.09);
        box-shadow: 0 12px 40px rgba(0,0,0,.18);
    }

    .event-date {
        display: inline-flex;
        padding: 8px 11px;
        border-radius: 10px;
        background: rgba(39,119,255,.15);
        color: #70b9ff;
        font-size: 13px;
        font-weight: 700;
        margin-bottom: 12px;
    }

    .event-title {
        font-size: 23px;
        font-weight: 800;
        margin-bottom: 9px;
    }

    .event-description {
        color: #b5bfd0;
        line-height: 1.55;
        white-space: pre-wrap;
    }

    .event-info {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 17px;
    }

    .info-tag {
        padding: 8px 11px;
        border-radius: 10px;
        background: rgba(255,255,255,.06);
        color: #c8d2e2;
        font-size: 13px;
    }

    .empty,
    .loading,
    .error {
        padding: 35px 20px;
        text-align: center;
        border-radius: 22px;
        background: rgba(255,255,255,.045);
        border: 1px solid rgba(255,255,255,.08);
        color: #aeb9ca;
    }

    .error {
        color: #ff9e9e;
    }

    @media (max-width: 650px) {
        .events-page {
            width: calc(100% - 18px);
            padding-top: 14px;
        }

        .events-header {
            flex-direction: column;
            align-items: stretch;
        }

        .hero {
            padding: 22px;
            border-radius: 22px;
        }

        .event-card {
            padding: 18px;
        }
    }
</style>

</head><body>
    <main class="events-page">    <div class="events-header">
        <a class="back-button" href="dashboard.html">← Назад</a>
        <div data-user-name>Користувач</div>
    </div>

    <section class="hero">
        <h1>📅 Події</h1>
        <p>Шкільні заходи, зустрічі, свята та інші важливі події ліцею.</p>
    </section>

    <div class="filters">
        <button class="filter-button active" data-filter="all">Усі</button>
        <button class="filter-button" data-filter="upcoming">Майбутні</button>
        <button class="filter-button" data-filter="past">Минулі</button>
    </div>

    <section id="eventsList" class="events-list">
        <div class="loading">Завантаження подій...</div>
    </section>

</main>

<script>
    let allEvents = [];
    let currentFilter = 'all';

    function escapeHtml(value) {
        return String(value ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    function getDateValue(event) {
        return event.event_date || event.date || event.start_date || null;
    }

    function formatDate(value) {
        if (!value) return 'Дата не вказана';

        const date = new Date(value);

        if (Number.isNaN(date.getTime())) {
            return value;
        }

        return date.toLocaleDateString('uk-UA', {
            day: '2-digit',
            month: 'long',
            year: 'numeric'
        });
    }

    function isPast(event) {
        const value = getDateValue(event);

        if (!value) return false;

        const eventDate = new Date(value);
        const today = new Date();

        eventDate.setHours(23, 59, 59, 999);
        today.setHours(0, 0, 0, 0);

        return eventDate < today;
    }

    function renderEvents() {
        const container = document.getElementById('eventsList');

        let events = [...allEvents];

        if (currentFilter === 'upcoming') {
            events = events.filter(event => !isPast(event));
        }

        if (currentFilter === 'past') {
            events = events.filter(isPast);
        }

        if (!events.length) {
            container.innerHTML = `
                <div class="empty">
                    <div style="font-size:36px;margin-bottom:10px;">📭</div>
                    <div>Подій у цьому розділі поки немає.</div>
                </div>
            `;
            return;
        }

        container.innerHTML = events.map(event => {
            const date = getDateValue(event);

            return `
                <article class="event-card">

                    <div class="event-date">
                        📅 ${escapeHtml(formatDate(date))}
                    </div>

                    <div class="event-title">
                        ${escapeHtml(event.title || event.name || 'Подія')}
                    </div>

                    <div class="event-description">
                        ${escapeHtml(event.description || event.content || 'Опис події відсутній.')}
                    </div>

                    <div class="event-info">

                        ${event.location
                            ? `<span class="info-tag">📍 ${escapeHtml(event.location)}</span>`
                            : ''}

                        ${event.class_name
                            ? `<span class="info-tag">👥 ${escapeHtml(event.class_name)}</span>`
                            : ''}

                        ${event.start_time
                            ? `<span class="info-tag">🕐 ${escapeHtml(event.start_time)}</span>`
                            : ''}

                    </div>

                </article>
            `;
        }).join('');
    }

    async function loadEvents() {
        const container = document.getElementById('eventsList');

        try {
            if (typeof supabaseClient === 'undefined') {
                throw new Error('Supabase не підключено.');
            }

            const { data, error } = await supabaseClient
                .from('events')
                .select('*')
                .order('event_date', { ascending: true });

            if (error) throw error;

            allEvents = data || [];
            renderEvents();

        } catch (error) {
            console.error('Events loading error:', error);

            container.innerHTML = `
                <div class="error">
                    Не вдалося завантажити події.<br>
                    Перевір таблицю events у Supabase.
                </div>
            `;
        }
    }

    document.querySelectorAll('[data-filter]').forEach(button => {
        button.addEventListener('click', () => {
            document.querySelectorAll('[data-filter]').forEach(item => {
                item.classList.remove('active');
            });

            button.classList.add('active');
            currentFilter = button.dataset.filter;

            renderEvents();
        });
    });

    document.addEventListener('DOMContentLoaded', loadEvents);
</script>

</body>
</html>
