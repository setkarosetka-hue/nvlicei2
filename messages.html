<!DOCTYPE html><html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Повідомлення — Ліцей №2</title>

<link rel="stylesheet" href="style.css">
<script src="supabase.js"></script>
<script src="app.js" defer></script>

<style>
    body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, sans-serif;
        background:
            radial-gradient(circle at 15% 10%, rgba(80,120,255,.18), transparent 30%),
            radial-gradient(circle at 85% 20%, rgba(0,220,255,.12), transparent 28%),
            #070b14;
        color: #fff;
    }

    .messages-page {
        width: min(1100px, calc(100% - 28px));
        margin: auto;
        padding: 24px 0 50px;
    }

    .page-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 15px;
        margin-bottom: 22px;
    }

    .back-button {
        color: #fff;
        text-decoration: none;
        padding: 11px 16px;
        border-radius: 14px;
        background: rgba(255,255,255,.07);
        border: 1px solid rgba(255,255,255,.1);
    }

    .hero {
        padding: 28px;
        border-radius: 28px;
        background: linear-gradient(
            135deg,
            rgba(45,105,255,.2),
            rgba(0,220,255,.08)
        );
        border: 1px solid rgba(255,255,255,.1);
        margin-bottom: 22px;
    }

    .hero h1 {
        margin: 0 0 8px;
        font-size: clamp(28px, 6vw, 44px);
    }

    .hero p {
        margin: 0;
        color: #aebbd1;
        line-height: 1.5;
    }

    .messages-list {
        display: grid;
        gap: 15px;
    }

    .message-card {
        padding: 21px;
        border-radius: 22px;
        background: rgba(255,255,255,.055);
        border: 1px solid rgba(255,255,255,.09);
        box-shadow: 0 12px 40px rgba(0,0,0,.18);
    }

    .message-card.unread {
        border-color: rgba(39,119,255,.5);
        background: rgba(39,119,255,.08);
    }

    .message-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 15px;
    }

    .message-subject {
        font-size: 20px;
        font-weight: 800;
        margin-bottom: 7px;
    }

    .message-date {
        color: #8f9caf;
        font-size: 13px;
        white-space: nowrap;
    }

    .message-text {
        margin-top: 14px;
        color: #c0cad9;
        line-height: 1.6;
        white-space: pre-wrap;
    }

    .message-status {
        display: inline-flex;
        margin-top: 15px;
        padding: 7px 10px;
        border-radius: 9px;
        font-size: 12px;
        background: rgba(255,255,255,.06);
        color: #aebbd1;
    }

    .message-card.unread .message-status {
        background: rgba(39,119,255,.15);
        color: #72b9ff;
    }

    .empty,
    .loading,
    .error {
        padding: 35px 20px;
        text-align: center;
        border-radius: 22px;
        background: rgba(255,255,255,.045);
        border: 1px solid rgba(255,255,255,.08);
        color: #aeb9ca;
    }

    .error {
        color: #ff9e9e;
    }

    @media (max-width: 650px) {
        .messages-page {
            width: calc(100% - 18px);
            padding-top: 14px;
        }

        .page-header {
            flex-direction: column;
            align-items: stretch;
        }

        .hero {
            padding: 22px;
            border-radius: 22px;
        }

        .message-top {
            flex-direction: column;
            gap: 7px;
        }

        .message-date {
            white-space: normal;
        }
    }
</style>

</head><body><main class="messages-page"><div class="page-header">
    <a class="back-button" href="dashboard.html">
        ← Назад
    </a>

    <div data-user-name>
        Користувач
    </div>
</div>

<section class="hero">
    <h1>💬 Повідомлення</h1>
    <p>
        Тут відображаються твої особисті повідомлення
        від адміністрації та інших користувачів ліцею.
    </p>
</section>

<section id="messagesList" class="messages-list">
    <div class="loading">
        Завантаження повідомлень...
    </div>
</section>

</main><script>
    function escapeHtml(value) {
        return String(value ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    function formatDate(value) {
        if (!value) {
            return 'Дата не вказана';
        }

        const date = new Date(value);

        if (Number.isNaN(date.getTime())) {
            return value;
        }

        return date.toLocaleString('uk-UA', {
            day: '2-digit',
            month: 'long',
            year: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
        });
    }

    async function loadMessages() {
        const container =
            document.getElementById('messagesList');

        try {

            if (typeof supabaseClient === 'undefined') {
                throw new Error(
                    'Supabase не підключено.'
                );
            }

            const user =
                await getCurrentUser();

            if (!user) {
                location.href = 'login.html';
                return;
            }

            const {
                data,
                error
            } = await supabaseClient
                .from('messages')
                .select('*')
                .eq('recipient_id', user.id)
                .order('created_at', {
                    ascending: false
                });

            if (error) {
                throw error;
            }

            const messages = data || [];

            if (!messages.length) {

                container.innerHTML = `
                    <div class="empty">
                        <div style="font-size:38px;margin-bottom:10px;">
                            📭
                        </div>

                        <div>
                            Повідомлень поки немає.
                        </div>
                    </div>
                `;

                return;
            }

            container.innerHTML =
                messages.map(message => {

                    const unread =
                        !message.is_read;

                    return `
                        <article
                            class="message-card ${
                                unread ? 'unread' : ''
                            }"
                        >

                            <div class="message-top">

                                <div>
                                    <div class="message-subject">
                                        ${escapeHtml(
                                            message.subject ||
                                            'Без теми'
                                        )}
                                    </div>
                                </div>

                                <div class="message-date">
                                    ${escapeHtml(
                                        formatDate(
                                            message.created_at
                                        )
                                    )}
                                </div>

                            </div>

                            <div class="message-text">
                                ${escapeHtml(
                                    message.message
                                )}
                            </div>

                            <div class="message-status">
                                ${
                                    unread
                                        ? '🔵 Нове повідомлення'
                                        : '✓ Прочитано'
                                }
                            </div>

                        </article>
                    `;
                }).join('');

            const unreadMessages =
                messages.filter(
                    message => !message.is_read
                );

            if (unreadMessages.length) {

                const ids =
                    unreadMessages.map(
                        message => message.id
                    );

                const {
                    error: updateError
                } = await supabaseClient
                    .from('messages')
                    .update({
                        is_read: true
                    })
                    .in('id', ids);

                if (updateError) {
                    console.warn(
                        'Не вдалося позначити повідомлення як прочитані:',
                        updateError
                    );
                }
            }

        } catch (error) {

            console.error(
                'Messages loading error:',
                error
            );

            container.innerHTML = `
                <div class="error">
                    Не вдалося завантажити повідомлення.<br>
                    Перевір таблицю messages та RLS-політики
                    у Supabase.
                </div>
            `;
        }
    }

    document.addEventListener(
        'DOMContentLoaded',
        loadMessages
    );
</script></body>
</html>
