<!DOCTYPE html><html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Повідомлення — Ліцей №2</title>
<link rel="stylesheet" href="style.css"><style>
body{
    margin:0;
    min-height:100vh;
    background:
        radial-gradient(circle at top left,rgba(37,99,235,.25),transparent 35%),
        radial-gradient(circle at bottom right,rgba(14,165,233,.18),transparent 35%),
        #07111f;
    color:#fff;
    font-family:Arial,sans-serif;
}

.page{
    width:min(1000px,calc(100% - 24px));
    margin:auto;
    padding:20px 0 50px;
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    padding:20px;
    margin-bottom:18px;
    border-radius:22px;
    background:rgba(10,24,42,.85);
    border:1px solid rgba(255,255,255,.1);
}

.top h1{
    margin:0 0 5px;
}

.top p{
    margin:0;
    color:#8fa2b8;
}

.back{
    color:white;
    text-decoration:none;
    padding:10px 14px;
    border-radius:12px;
    background:rgba(255,255,255,.07);
}

.messages{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.message{
    padding:20px;
    border-radius:20px;
    background:rgba(10,24,42,.8);
    border:1px solid rgba(255,255,255,.09);
    transition:.2s;
}

.message.unread{
    border-color:rgba(37,99,235,.55);
    background:rgba(19,43,75,.82);
}

.message:hover{
    transform:translateY(-2px);
}

.message-head{
    display:flex;
    justify-content:space-between;
    gap:12px;
}

.subject{
    font-size:18px;
    font-weight:700;
}

.date{
    color:#7f92a8;
    font-size:12px;
    white-space:nowrap;
}

.text{
    margin-top:12px;
    color:#c9d7e7;
    line-height:1.55;
    white-space:pre-wrap;
}

.status{
    display:inline-block;
    margin-top:14px;
    padding:5px 9px;
    border-radius:999px;
    font-size:12px;
    background:rgba(255,255,255,.07);
    color:#91a4ba;
}

.unread .status{
    background:rgba(37,99,235,.18);
    color:#8bb7ff;
}

.empty{
    text-align:center;
    padding:50px 20px;
    border-radius:20px;
    background:rgba(10,24,42,.7);
    color:#8194aa;
}

.loading{
    text-align:center;
    color:#8194aa;
    padding:40px;
}

@media(max-width:600px){
    .top{
        flex-direction:column;
        align-items:flex-start;
    }

    .message-head{
        flex-direction:column;
    }

    .date{
        white-space:normal;
    }
}
</style></head><body><div class="page"><header class="top"><div>
<h1>💬 Повідомлення</h1>
<p>Ваші особисті повідомлення</p>
</div><a href="dashboard.html" class="back">
← Назад
</a></header><main><div id="messages" class="messages"><div class="loading">
Завантаження повідомлень...
</div></div></main></div><script src="supabase.js"></script><script src="app.js"></script><script>

document.addEventListener("DOMContentLoaded",async()=>{

const container=document.getElementById("messages");

const {
data:{user},
error:authError
}=await supabaseClient.auth.getUser();

if(authError || !user){

location.href="login.html";

return;

}


function escape(value){

return String(value??"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


function formatDate(value){

if(!value)return "";

const date=new Date(value);

return date.toLocaleString("uk-UA",{
day:"2-digit",
month:"2-digit",
year:"numeric",
hour:"2-digit",
minute:"2-digit"
});

}


async function loadMessages(){

const {data,error}=await supabaseClient
.from("messages")
.select("*")
.eq("recipient_id",user.id)
.order("created_at",{ascending:false});


if(error){

console.error(error);

container.innerHTML=`
<div class="empty">
Не вдалося завантажити повідомлення.
</div>`;

return;

}


if(!data || !data.length){

container.innerHTML=`
<div class="empty">
📭<br><br>
У вас поки немає повідомлень.
</div>`;

return;

}


container.innerHTML=data.map(message=>`

<article
class="message ${message.is_read ? "" : "unread"}"
data-id="${message.id}"
>

<div class="message-head">

<div class="subject">
${escape(message.subject)}
</div>

<div class="date">
${formatDate(message.created_at)}
</div>

</div>

<div class="text">
${escape(message.message)}
</div>

<div class="status">

${message.is_read ? "Прочитано" : "Нове повідомлення"}

</div>

</article>

`).join("");


const unread=data
.filter(message=>!message.is_read)
.map(message=>message.id);


if(unread.length){

const {error:updateError}=await supabaseClient
.from("messages")
.update({is_read:true})
.in("id",unread);

if(updateError){
console.error(updateError);
}

}

}


await loadMessages();

});

</script></body>
</html>
