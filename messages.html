<!DOCTYPE html><html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#07111f"><title>Повідомлення — Ліцей №2</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="app.js" defer></script>

</head><body><header class="site-header">
    <div class="container header-inner">    <a href="dashboard.html" class="brand">
        <span class="brand-mark">Л2</span>

        <span class="brand-text">
            <strong>Ліцей №2</strong>
            <small>Повідомлення</small>
        </span>
    </a>

    <button
        type="button"
        class="mobile-menu-button"
        id="mobileMenuButton"
        aria-label="Відкрити меню"
        aria-expanded="false">
        ☰
    </button>

    <nav class="main-nav" id="mainNav">
        <a href="dashboard.html">Кабінет</a>
        <a href="announcements.html">Оголошення</a>
        <a href="messages.html" class="active">Повідомлення</a>
        <a href="events.html">Події</a>
    </nav>

</div>

</header><main class="container page-content"><section class="page-hero">
    <div>
        <span class="eyebrow">Спілкування</span>
        <h1>Повідомлення</h1>
        <p>Ваші повідомлення та повідомлення від адміністрації й педагогів.</p>
    </div>
</section>

<section id="messagesStatus" class="status-box">
    Завантаження повідомлень...
</section>

<section id="messagesList" class="messages-list"></section>

</main><footer class="site-footer">
    <div class="container">
        <p>© <span id="currentYear"></span> Ліцей №2</p>
    </div>
</footer><style>
    .page-content {
        padding-top: 28px;
        padding-bottom: 48px;
    }

    .page-hero {
        margin-bottom: 20px;
        padding: 26px;
        border: 1px solid var(--border-color);
        border-radius: 22px;
        background:
            radial-gradient(circle at top right, rgba(70, 130, 255, .18), transparent 35%),
            var(--surface-color);
    }

    .page-hero h1 {
        margin: 6px 0 8px;
        font-size: clamp(27px, 5vw, 38px);
    }

    .page-hero p {
        margin: 0;
        color: var(--muted-text);
    }

    .eyebrow {
        color: var(--primary-color);
        font-size: 13px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: .08em;
    }

    .status-box {
        padding: 18px;
        margin-bottom: 14px;
        border: 1px solid var(--border-color);
        border-radius: 16px;
        background: var(--surface-color);
        color: var(--muted-text);
        text-align: center;
    }

    .status-box.error-state {
        color: #ff9d9d;
        border-color: rgba(255, 90, 90, .35);
    }

    .messages-list {
        display: grid;
        gap: 13px;
    }

    .message-card {
        padding: 18px;
        border: 1px solid var(--border-color);
        border-radius: 19px;
        background: var(--surface-color);
        transition: transform .18s ease, border-color .18s ease;
    }

    .message-card:hover {
        transform: translateY(-2px);
        border-color: rgba(100, 150, 255, .35);
    }

    .message-card.unread {
        border-color: rgba(90, 145, 255, .5);
        box-shadow: 0 0 0 1px rgba(90, 145, 255, .08);
    }

    .message-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
    }

    .message-title {
        margin: 0;
        font-size: 18px;
        font-weight: 750;
    }

    .message-date {
        color: var(--muted-text);
        font-size: 12px;
        white-space: nowrap;
    }

    .message-text {
        margin: 12px 0 0;
        line-height: 1.55;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
    }

    .message-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        margin-top: 14px;
    }

    .message-meta span {
        padding: 5px 8px;
        border-radius: 8px;
        background: rgba(255,255,255,.05);
        color: var(--muted-text);
        font-size: 12px;
    }

    .unread-badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 5px 8px;
        border-radius: 8px;
        background: rgba(70, 130, 255, .14);
        color: #a9c5ff;
        font-size: 11px;
        font-weight: 700;
    }

    .empty-state {
        padding: 36px 18px;
        border: 1px dashed var(--border-color);
        border-radius: 18px;
        color: var(--muted-text);
        text-align: center;
    }

    .error-state {
        color: #ff9d9d;
    }

    @media (max-width: 650px) {
        .page-content {
            padding-top: 18px;
        }

        .page-hero {
            padding: 21px 17px;
            border-radius: 19px;
        }

        .message-card {
            padding: 15px;
            border-radius: 16px;
        }

        .message-top {
            flex-direction: column;
            gap: 7px;
        }

        .message-date {
            white-space: normal;
        }
    }
</style><script>
(function () {
    "use strict";

    const statusElement = document.getElementById("messagesStatus");
    const listElement = document.getElementById("messagesList");

    function escapeHtml(value) {
        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function formatDate(value) {
        if (!value) return "Дата не вказана";

        const date = new Date(value);

        if (Number.isNaN(date.getTime())) {
            return "Дата не вказана";
        }

        return date.toLocaleString("uk-UA", {
            day: "2-digit",
            month: "long",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit"
        });
    }

    function showStatus(message, isError) {
        statusElement.textContent = message;
        statusElement.classList.toggle("error-state", Boolean(isError));
        statusElement.style.display = "block";
    }

    function renderMessages(messages) {
        listElement.innerHTML = "";

        if (!messages.length) {
            statusElement.style.display = "none";

            listElement.innerHTML = `
                <div class="empty-state">
                    💬 Повідомлень поки немає.
                </div>
            `;

            return;
        }

        statusElement.style.display = "none";

        messages.forEach(item => {
            const card = document.createElement("article");

            const isUnread = item.is_read === false;

            card.className = "message-card" + (isUnread ? " unread" : "");

            const recipientGroup = item.recipient_group
                ? `<span>👥 ${escapeHtml(item.recipient_group)}</span>`
                : "";

            const sender = item.sender_id
                ? `<span>Відправник: ${escapeHtml(String(item.sender_id).slice(0, 8))}…</span>`
                : "";

            const unread = isUnread
                ? `<span class="unread-badge">● Нове</span>`
                : "";

            card.innerHTML = `
                <div class="message-top">
                    <h2 class="message-title">
                        ${escapeHtml(item.subject || "Без теми")}
                    </h2>

                    <time class="message-date">
                        ${escapeHtml(formatDate(item.created_at))}
                    </time>
                </div>

                <div class="message-text">
                    ${escapeHtml(item.message || "")}
                </div>

                <div class="message-meta">
                    ${unread}
                    ${recipientGroup}
                    ${sender}
                </div>
            `;

            listElement.appendChild(card);
        });
    }

    async function loadMessages() {
        listElement.innerHTML = "";

        if (
            typeof window.supabaseClient === "undefined" ||
            !window.supabaseClient
        ) {
            showStatus(
                "Не вдалося підключити Supabase. Перевір файл supabase.js.",
                true
            );
            return;
        }

        showStatus("Завантаження повідомлень...", false);

        try {
            const { data: userData, error: userError } =
                await window.supabaseClient.auth.getUser();

            if (userError || !userData || !userData.user) {
                showStatus(
                    "Не вдалося визначити поточного користувача.",
                    true
                );
                return;
            }

            const userId = userData.user.id;

            const { data, error } = await window.supabaseClient
                .from("messages")
                .select("*")
                .or(
                    "recipient_id.eq." +
                    userId +
                    ",recipient_group.eq.all"
                )
                .order("created_at", { ascending: false });

            if (error) {
                console.error("Messages Supabase error:", error);

                showStatus(
                    "Не вдалося завантажити повідомлення. Перевір таблицю messages та RLS-політики у Supabase.",
                    true
                );

                listElement.innerHTML = `
                    <div class="empty-state error-state">
                        ⚠️ Supabase не дозволив отримати дані з таблиці messages.
                    </div>
                `;

                return;
            }

            renderMessages(Array.isArray(data) ? data : []);

        } catch (error) {
            console.error("Messages loading error:", error);

            showStatus(
                "Сталася помилка під час завантаження повідомлень.",
                true
            );
        }
    }

    document.addEventListener("DOMContentLoaded", function () {
        loadMessages();
    });

    if (document.readyState !== "loading") {
        loadMessages();
    }
})();
</script></body>
</html>
