<!DOCTYPE html><html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Повідомлення — Ліцей №2</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="app.js" defer></script>

<style>
    .messages-page {
        width: min(1100px, calc(100% - 24px));
        margin: auto;
        padding: 20px 0 40px;
    }

    .messages-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 20px;
        margin-bottom: 18px;
        border-radius: 22px;
        background: rgba(255,255,255,.07);
        border: 1px solid rgba(255,255,255,.1);
    }

    .messages-header h1 {
        margin: 0 0 5px;
    }

    .messages-header p {
        margin: 0;
        opacity: .65;
    }

    .back-btn {
        padding: 10px 15px;
        border-radius: 13px;
        text-decoration: none;
        color: inherit;
        background: rgba(255,255,255,.09);
        border: 1px solid rgba(255,255,255,.1);
        white-space: nowrap;
    }

    .messages-status {
        padding: 14px 17px;
        margin-bottom: 16px;
        border-radius: 16px;
        background: rgba(255,255,255,.06);
        border: 1px solid rgba(255,255,255,.08);
    }

    .messages-list {
        display: grid;
        gap: 13px;
    }

    .message-card {
        padding: 20px;
        border-radius: 20px;
        background: rgba(255,255,255,.065);
        border: 1px solid rgba(255,255,255,.09);
        transition: transform .2s ease, background .2s ease;
    }

    .message-card:hover {
        transform: translateY(-2px);
        background: rgba(255,255,255,.09);
    }

    .message-card.unread {
        border-color: rgba(0,170,255,.3);
        background: rgba(0,170,255,.06);
    }

    .message-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 15px;
    }

    .message-title {
        margin: 0 0 8px;
        font-size: 19px;
    }

    .message-date {
        font-size: 12px;
        opacity: .55;
        white-space: nowrap;
    }

    .message-text {
        margin: 12px 0 0;
        line-height: 1.6;
        white-space: pre-wrap;
        opacity: .82;
    }

    .message-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 15px;
    }

    .meta {
        padding: 6px 9px;
        border-radius: 9px;
        background: rgba(255,255,255,.06);
        font-size: 12px;
        opacity: .7;
    }

    .unread-label {
        display: inline-block;
        margin-bottom: 9px;
        padding: 5px 9px;
        border-radius: 8px;
        background: rgba(0,170,255,.16);
        font-size: 11px;
    }

    .empty {
        padding: 40px 20px;
        text-align: center;
        border-radius: 20px;
        background: rgba(255,255,255,.05);
        border: 1px dashed rgba(255,255,255,.12);
    }

    .empty-icon {
        font-size: 42px;
        margin-bottom: 10px;
    }

    .empty p {
        margin: 0;
        opacity: .65;
    }

    .error {
        color: #ffb4b4;
    }

    @media (max-width: 600px) {
        .messages-page {
            width: min(100% - 16px, 1100px);
        }

        .messages-header {
            padding: 16px;
        }

        .messages-header h1 {
            font-size: 24px;
        }

        .back-btn {
            padding: 9px 11px;
            font-size: 13px;
        }

        .message-card {
            padding: 17px;
        }

        .message-top {
            flex-direction: column;
            gap: 5px;
        }

        .message-date {
            white-space: normal;
        }
    }
</style>

</head><body><main class="messages-page"><header class="messages-header">
    <div>
        <h1>💬 Повідомлення</h1>
        <p>Ваші повідомлення від адміністрації та вчителів</p>
    </div>

    <a href="dashboard.html" class="back-btn">
        🏠 Головна
    </a>
</header>

<div id="messagesStatus" class="messages-status">
    Завантаження повідомлень...
</div>

<section id="messagesList" class="messages-list"></section>

</main><script>
document.addEventListener("DOMContentLoaded", async () => {

    const status = document.getElementById("messagesStatus");
    const list = document.getElementById("messagesList");

    function escapeHTML(value) {
        if (value === null || value === undefined) return "";

        return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }

    function formatDate(value) {

        if (!value) return "Дата не вказана";

        const date = new Date(value);

        if (Number.isNaN(date.getTime())) {
            return escapeHTML(value);
        }

        return date.toLocaleString("uk-UA", {
            day: "2-digit",
            month: "2-digit",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit"
        });
    }

    function renderMessages(messages) {

        if (!messages || messages.length === 0) {

            status.textContent = "Нових повідомлень немає.";

            list.innerHTML = `
                <div class="empty">
                    <div class="empty-icon">💬</div>
                    <p>Коли вам надійде повідомлення, воно з'явиться тут.</p>
                </div>
            `;

            return;
        }

        const unreadCount =
            messages.filter(message => message.is_read === false).length;

        status.textContent =
            unreadCount > 0
                ? `Повідомлень: ${messages.length} · Непрочитаних: ${unreadCount}`
                : `Повідомлень: ${messages.length}`;

        list.innerHTML = messages.map(message => {

            const unread = message.is_read === false;

            const title =
                escapeHTML(message.subject || "Повідомлення");

            const text =
                escapeHTML(message.message || "");

            const group =
                escapeHTML(message.recipient_group || "Особисте");

            const sender =
                message.sender_id
                    ? escapeHTML(String(message.sender_id).slice(0, 8) + "…")
                    : "Адміністрація";

            return `
                <article class="message-card ${unread ? "unread" : ""}">

                    ${unread ? '<div class="unread-label">● Непрочитане</div>' : ""}

                    <div class="message-top">

                        <div>
                            <h2 class="message-title">
                                ${title}
                            </h2>
                        </div>

                        <div class="message-date">
                            ${formatDate(message.created_at)}
                        </div>

                    </div>

                    <div class="message-text">
                        ${text}
                    </div>

                    <div class="message-meta">

                        <span class="meta">
                            👤 ${sender}
                        </span>

                        <span class="meta">
                            👥 ${group}
                        </span>

                    </div>

                </article>
            `;

        }).join("");
    }

    try {

        if (!window.supabaseClient) {

            status.innerHTML =
                '<span class="error">Не вдалося підключити Supabase. Перевір supabase.js.</span>';

            return;
        }

        const {
            data: userData,
            error: userError
        } = await window.supabaseClient.auth.getUser();

        if (userError || !userData || !userData.user) {

            status.innerHTML =
                '<span class="error">Не вдалося визначити користувача.</span>';

            return;
        }

        const userId = userData.user.id;

        const {
            data: messages,
            error
        } = await window.supabaseClient
            .from("messages")
            .select("*")
            .or(
                `recipient_id.eq.${userId},recipient_group.eq.all`
            )
            .order("created_at", {
                ascending: false
            });

        if (error) {

            console.error("Supabase messages error:", error);

            status.innerHTML =
                '<span class="error">Не вдалося завантажити повідомлення. Перевір таблицю messages та RLS.</span>';

            list.innerHTML = `
                <div class="empty">
                    <div class="empty-icon">⚠️</div>
                    <p>Supabase повернув помилку під час отримання повідомлень.</p>
                </div>
            `;

            return;
        }

        renderMessages(messages);

    } catch (error) {

        console.error("Messages loading error:", error);

        status.innerHTML =
            '<span class="error">Помилка під час завантаження повідомлень.</span>';
    }

});
</script></body>
</html>
