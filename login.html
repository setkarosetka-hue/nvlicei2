<!DOCTYPE html><html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вхід — Ліцей №2</title><link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

</head><body class="auth-page"><main class="auth-container">
<section class="auth-card"><div class="auth-logo">
    <div class="logo-mark">Л2</div>

    <div>
        <h1>Ліцей №2</h1>
        <p>Єдина система ліцею</p>
    </div>
</div>

<div class="auth-tabs">
    <button class="auth-tab active" id="loginTab" type="button">
        Вхід
    </button>

    <button class="auth-tab" id="registerTab" type="button">
        Реєстрація
    </button>
</div>

<div id="message" class="auth-message" style="display:none;"></div>

<form id="loginForm">

    <label for="loginEmail">Електронна пошта</label>

    <input
        id="loginEmail"
        type="email"
        placeholder="example@email.com"
        autocomplete="email"
        required
    >

    <label for="loginPassword">Пароль</label>

    <input
        id="loginPassword"
        type="password"
        placeholder="Введіть пароль"
        autocomplete="current-password"
        required
    >

    <button class="primary-button" id="loginButton" type="submit">
        Увійти
    </button>

    <button
        class="text-button"
        id="forgotPassword"
        type="button"
    >
        Забули пароль?
    </button>

</form>


<form id="registerForm" style="display:none;">

    <label for="registerName">Ім'я та прізвище</label>

    <input
        id="registerName"
        type="text"
        placeholder="Наприклад: Іван Петренко"
        autocomplete="name"
        required
    >

    <label for="registerEmail">Електронна пошта</label>

    <input
        id="registerEmail"
        type="email"
        placeholder="example@email.com"
        autocomplete="email"
        required
    >

    <label for="registerPassword">Пароль</label>

    <input
        id="registerPassword"
        type="password"
        placeholder="Мінімум 6 символів"
        autocomplete="new-password"
        minlength="6"
        required
    >

    <label for="registerRole">Ваша роль</label>

    <select id="registerRole" required>
        <option value="">Оберіть роль</option>
        <option value="student">Учень</option>
        <option value="teacher">Вчитель</option>
        <option value="parent">Батько / Мати</option>
    </select>

    <div class="role-info">
        <strong>Важливо</strong>

        <span>
            Після реєстрації роль має бути підтверджена адміністрацією.
        </span>
    </div>

    <label class="checkbox-row">
        <input id="registerConsent" type="checkbox" required>

        <span>
            Я погоджуюся з правилами використання системи.
        </span>
    </label>

    <button
        class="primary-button"
        id="registerButton"
        type="submit"
    >
        Створити акаунт
    </button>

</form>


<div class="auth-footer">
    <a href="index.html">← На головну</a>
    <a href="consent.html">Правила системи</a>
</div>

</section>
</main><script>

const SUPABASE_URL =
    "https://atfhyyarjqiwlaxixbrd.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_2rtmu-1UkcDR4D35qkGwgw_AQDBR8Lw";


let client = null;


function showMessage(text, type = "info") {

    const message = document.getElementById("message");

    message.textContent = text;

    message.className =
        "auth-message " + type;

    message.style.display = "block";
}


function hideMessage() {

    const message = document.getElementById("message");

    message.textContent = "";

    message.className = "auth-message";

    message.style.display = "none";
}


async function getSupabaseClient() {

    if (window.supabaseClient) {
        return window.supabaseClient;
    }

    if (
        window.supabase &&
        typeof window.supabase.createClient === "function"
    ) {

        if (!client) {

            client =
                window.supabase.createClient(
                    SUPABASE_URL,
                    SUPABASE_KEY
                );

        }

        return client;
    }

    throw new Error(
        "Supabase не завантажився."
    );
}


document.addEventListener(
    "DOMContentLoaded",
    async () => {

        const loginTab =
            document.getElementById("loginTab");

        const registerTab =
            document.getElementById("registerTab");

        const loginForm =
            document.getElementById("loginForm");

        const registerForm =
            document.getElementById("registerForm");


        try {

            client =
                await getSupabaseClient();

            if (!client) {
                throw new Error(
                    "Не вдалося створити Supabase client."
                );
            }

        } catch (error) {

            console.error(
                "Supabase login error:",
                error
            );

            showMessage(
                "Не вдалося підключити систему входу. Оновіть сторінку та спробуйте ще раз.",
                "error"
            );

            return;
        }


        function switchMode(mode) {

            hideMessage();

            if (mode === "login") {

                loginTab.classList.add("active");
                registerTab.classList.remove("active");

                loginForm.style.display = "block";
                registerForm.style.display = "none";

            } else {

                registerTab.classList.add("active");
                loginTab.classList.remove("active");

                loginForm.style.display = "none";
                registerForm.style.display = "block";
            }
        }


        loginTab.addEventListener(
            "click",
            () => switchMode("login")
        );


        registerTab.addEventListener(
            "click",
            () => switchMode("register")
        );


        loginForm.addEventListener(
            "submit",
            async event => {

                event.preventDefault();

                hideMessage();

                const email =
                    document
                        .getElementById("loginEmail")
                        .value
                        .trim()
                        .toLowerCase();

                const password =
                    document
                        .getElementById("loginPassword")
                        .value;


                if (!email || !password) {

                    showMessage(
                        "Заповніть усі поля.",
                        "error"
                    );

                    return;
                }


                const button =
                    document.getElementById(
                        "loginButton"
                    );


                button.disabled = true;
                button.textContent = "Вхід...";


                try {

                    const result =
                        await client.auth.signInWithPassword({
                            email: email,
                            password: password
                        });


                    const data = result.data;
                    const error = result.error;


                    if (error) {

                        console.error(
                            "Supabase Auth:",
                            error
                        );

                        showMessage(
                            "Помилка входу: " +
                            error.message,
                            "error"
                        );

                        return;
                    }


                    if (!data || !data.user) {

                        showMessage(
                            "Користувача не знайдено.",
                            "error"
                        );

                        return;
                    }


                    localStorage.setItem(
                        "licei2_user",
                        JSON.stringify({
                            id: data.user.id,
                            email: data.user.email
                        })
                    );


                    let role = "pending";


                    try {

                        const profileResult =
                            await client
                                .from("profiles")
                                .select("role,full_name")
                                .eq("id", data.user.id)
                                .maybeSingle();


                        if (
                            !profileResult.error &&
                            profileResult.data
                        ) {

                            role =
                                profileResult.data.role ||
                                "pending";

                        } else if (
                            profileResult.error
                        ) {

                            console.warn(
                                "Profile query:",
                                profileResult.error
                            );
                        }

                    } catch (profileError) {

                        console.warn(
                            "Profile error:",
                            profileError
                        );
                    }


                    showMessage(
                        "Вхід виконано. Відкриваємо систему...",
                        "success"
                    );


                    setTimeout(
                        () => {

                            if (role === "admin") {

                                window.location.href =
                                    "admin.html";

                                return;
                            }


                            if (role === "teacher") {

                                window.location.href =
                                    "teacher.html";

                                return;
                            }


                            if (role === "student") {

                                window.location.href =
                                    "student.html";

                                return;
                            }


                            if (role === "parent") {

                                window.location.href =
                                    "parent.html";

                                return;
                            }


                            window.location.href =
                                "dashboard.html";

                        },
                        400
                    );

                } catch (error) {

                    console.error(
                        "Login error:",
                        error
                    );

                    showMessage(
                        "Сталася помилка під час входу: " +
                        (error.message || "невідома помилка"),
                        "error"
                    );

                } finally {

                    button.disabled = false;
                    button.textContent = "Увійти";
                }
            }
        );


        registerForm.addEventListener(
            "submit",
            async event => {

                event.preventDefault();

                hideMessage();


                const name =
                    document
                        .getElementById("registerName")
                        .value
                        .trim();


                const email =
                    document
                        .getElementById("registerEmail")
                        .value
                        .trim()
                        .toLowerCase();


                const password =
                    document
                        .getElementById("registerPassword")
                        .value;


                const role =
                    document
                        .getElementById("registerRole")
                        .value;


                const consent =
                    document
                        .getElementById("registerConsent")
                        .checked;


                if (
                    !name ||
                    !email ||
                    !password ||
                    !role
                ) {

                    showMessage(
                        "Заповніть усі поля.",
                        "error"
                    );

                    return;
                }


                if (!consent) {

                    showMessage(
                        "Потрібно погодитися з правилами системи.",
                        "error"
                    );

                    return;
                }


                if (password.length < 6) {

                    showMessage(
                        "Пароль повинен містити щонайменше 6 символів.",
                        "error"
                    );

                    return;
                }


                const button =
                    document.getElementById(
                        "registerButton"
                    );


                button.disabled = true;
                button.textContent = "Створення...";


                try {

                    const redirectUrl =
                        "https://licei2.pntr.dev/verify-email.html";


                    const result =
                        await client.auth.signUp({
                            email: email,
                            password: password,

                            options: {
                                emailRedirectTo:
                                    redirectUrl,

                                data: {
                                    full_name: name,
                                    requested_role: role
                                }
                            }
                        });


                    const data = result.data;
                    const error = result.error;


                    if (error) {

                        showMessage(
                            "Не вдалося зареєструватися: " +
                            error.message,
                            "error"
                        );

                        return;
                    }


                    if (data && data.user) {

                        const profileResult =
                            await client
                                .from("profiles")
                                .upsert({
                                    id: data.user.id,
                                    email: email,
                                    full_name: name,
                                    role: "pending",
                                    updated_at:
                                        new Date().toISOString()
                                });


                        if (profileResult.error) {

                            console.warn(
                                "Профіль:",
                                profileResult.error
                            );
                        }
                    }


                    showMessage(
                        "Реєстрацію завершено. Перевірте електронну пошту та підтвердьте адресу.",
                        "success"
                    );


                    registerForm.reset();

                } catch (error) {

                    console.error(
                        "Register error:",
                        error
                    );

                    showMessage(
                        "Сталася помилка під час реєстрації: " +
                        (error.message || "невідома помилка"),
                        "error"
                    );

                } finally {

                    button.disabled = false;
                    button.textContent =
                        "Створити акаунт";
                }
            }
        );


        document
            .getElementById("forgotPassword")
            .addEventListener(
                "click",
                async () => {

                    hideMessage();


                    const email =
                        document
                            .getElementById("loginEmail")
                            .value
                            .trim()
                            .toLowerCase();


                    if (!email) {

                        showMessage(
                            "Спочатку введіть свою електронну пошту.",
                            "error"
                        );

                        return;
                    }


                    try {

                        const result =
                            await client.auth
                                .resetPasswordForEmail(
                                    email,
                                    {
                                        redirectTo:
                                            "https://licei2.pntr.dev/reset-password.html"
                                    }
                                );


                        if (result.error) {

                            showMessage(
                                "Не вдалося надіслати лист: " +
                                result.error.message,
                                "error"
                            );

                            return;
                        }


                        showMessage(
                            "Лист для відновлення пароля надіслано на вашу пошту.",
                            "success"
                        );

                    } catch (error) {

                        console.error(
                            "Reset password:",
                            error
                        );

                        showMessage(
                            "Сталася помилка під час відновлення пароля.",
                            "error"
                        );
                    }
                }
            );

    }
);

</script></body>
</html>
