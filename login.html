<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Вхід — Ліцей №2</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
</head>
<body class="auth-page">
  <main class="auth-container">
    <section class="auth-card">
      <div class="auth-logo"><div class="logo-mark">Л2</div><div><h1>Ліцей №2</h1><p>Єдина система ліцею</p></div></div>
      <div class="auth-tabs"><button class="auth-tab active" id="loginTab" type="button">Вхід</button><button class="auth-tab" id="registerTab" type="button">Реєстрація</button></div>
      <div id="message" class="auth-message" style="display:none" aria-live="polite"></div>
      <form id="loginForm">
        <label for="loginEmail">Електронна пошта</label><input id="loginEmail" type="email" autocomplete="email" required />
        <label for="loginPassword">Пароль</label><input id="loginPassword" type="password" autocomplete="current-password" required />
        <button class="primary-button" id="loginButton" type="submit">Увійти</button>
        <button class="text-button" id="forgotPassword" type="button">Забули пароль?</button>
      </form>
      <form id="registerForm" style="display:none">
        <label for="registerName">Ім'я та прізвище</label><input id="registerName" type="text" autocomplete="name" required />
        <label for="registerEmail">Електронна пошта</label><input id="registerEmail" type="email" autocomplete="email" required />
        <label for="registerPassword">Пароль</label><input id="registerPassword" type="password" autocomplete="new-password" minlength="6" required />
        <label for="registerRole">Ваша роль</label><select id="registerRole" required><option value="">Оберіть роль</option><option value="student">Учень</option><option value="teacher">Вчитель</option><option value="parent">Батько / Мати</option></select>
        <label class="checkbox-row"><input id="registerConsent" type="checkbox" required /><span>Я погоджуюся з правилами системи.</span></label>
        <button class="primary-button" id="registerButton" type="submit">Створити акаунт</button>
      </form>
      <div class="auth-footer"><a href="index.html">← На головну</a><a href="consent.html">Правила системи</a></div>
    </section>
  </main>
<script>
document.addEventListener('DOMContentLoaded',()=>{
 const client=window.supabaseClient;const loginForm=document.getElementById('loginForm');const registerForm=document.getElementById('registerForm');const message=document.getElementById('message');
 const show=(text,type='info')=>{message.textContent=text;message.className='auth-message '+type;message.style.display='block'};
 const setTab=(login)=>{document.getElementById('loginTab').classList.toggle('active',login);document.getElementById('registerTab').classList.toggle('active',!login);loginForm.style.display=login?'block':'none';registerForm.style.display=login?'none':'block';message.style.display='none'};
 document.getElementById('loginTab').onclick=()=>setTab(true);document.getElementById('registerTab').onclick=()=>setTab(false);
 loginForm.onsubmit=async e=>{e.preventDefault();if(!client){show('Supabase ще не підключився. Оновіть сторінку.','error');return}const button=document.getElementById('loginButton');button.disabled=true;button.textContent='Вхід...';try{const {data,error}=await client.auth.signInWithPassword({email:document.getElementById('loginEmail').value.trim().toLowerCase(),password:document.getElementById('loginPassword').value});if(error)throw error;if(!data?.user)throw new Error('Користувача не знайдено.');const {data:profile,error:profileError}=await client.from('profiles').select('id,email,full_name,role').eq('id',data.user.id).maybeSingle();if(profileError)throw profileError;const role=profile?.role||'pending';if(!['admin','teacher','student','parent','pending'].includes(role))throw new Error('Невідома роль профілю.');if(role==='pending'){show('Профіль очікує підтвердження адміністрацією.','info');return}localStorage.setItem('licei2_user',JSON.stringify({id:data.user.id,email:data.user.email}));const destinations={admin:'admin.html',teacher:'teacher.html',student:'student.html',parent:'parent.html'};window.location.replace(destinations[role]);}catch(error){console.error('LOGIN ERROR:',error);show(error.message?.includes('Invalid login')?'Неправильна електронна пошта або пароль.':error.message||'Не вдалося виконати вхід.','error')}finally{button.disabled=false;button.textContent='Увійти'}};
 registerForm.onsubmit=async e=>{e.preventDefault();if(!client)return show('Supabase ще не підключився.','error');const name=document.getElementById('registerName').value.trim(),email=document.getElementById('registerEmail').value.trim().toLowerCase(),password=document.getElementById('registerPassword').value,requestedRole=document.getElementById('registerRole').value;if(!document.getElementById('registerConsent').checked)return show('Потрібно погодитися з правилами.','error');try{const {data,error}=await client.auth.signUp({email,password,options:{data:{full_name:name,requested_role:requestedRole},emailRedirectTo:'https://licei2.pntr.dev/verify-email.html'}});if(error)throw error;if(data?.user){const {error:profileError}=await client.from('profiles').upsert({id:data.user.id,email,full_name:name,role:'pending',updated_at:new Date().toISOString()});if(profileError)console.warn('Profile upsert:',profileError)}show('Реєстрацію завершено. Перевірте електронну пошту.','success');registerForm.reset()}catch(error){console.error('REGISTER ERROR:',error);show(error.message||'Помилка реєстрації.','error')}};
 document.getElementById('forgotPassword').onclick=async()=>{const email=document.getElementById('loginEmail').value.trim().toLowerCase();if(!email)return show('Введіть електронну пошту.','error');const {error}=await client.auth.resetPasswordForEmail(email,{redirectTo:'https://licei2.pntr.dev/reset-password.html'});show(error?error.message:'Лист для відновлення пароля надіслано. ',error?'error':'success')};
});
</script>
</body></html>
