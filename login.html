<!DOCTYPE html><html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#07111f">
    <title>Вхід — Ліцей №2</title><link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="app.js" defer></script>

</head><body class="auth-page">
    <div class="page-background"></div><main class="auth-container">

    <section class="auth-brand">
        <a href="index.html" class="auth-logo">
            <span class="auth-logo-mark">Л2</span>
            <span class="auth-logo-name">Ліцей №2</span>
        </a>
    </section>

    <section class="auth-card">

        <div class="auth-heading">
            <span class="eyebrow">ЛІЦЕЙ №2</span>
            <h1 id="authTitle">Вхід</h1>
            <p id="authSubtitle">Увійдіть до цифрової системи ліцею.</p>
        </div>

        <div id="authMessage" class="auth-message" hidden></div>

        <div class="auth-tabs">
            <button type="button" class="auth-tab active" id="loginTab">
                Увійти
            </button>

            <button type="button" class="auth-tab" id="registerTab">
                Реєстрація
            </button>
        </div>

        <form id="loginForm" class="auth-form">

            <label for="loginEmail">
                Email
            </label>

            <input
                id="loginEmail"
                type="email"
                placeholder="name@example.com"
                autocomplete="email"
                required
            >

            <label for="loginPassword">
                Пароль
            </label>

            <div class="password-field">
                <input
                    id="loginPassword"
                    type="password"
                    placeholder="Введіть пароль"
                    autocomplete="current-password"
                    required
                >

                <button
                    type="button"
                    class="password-toggle"
                    data-password-toggle="loginPassword"
                    aria-label="Показати пароль"
                >
                    👁
                </button>
            </div>

            <button type="submit" class="primary-button" id="loginButton">
                Увійти
            </button>

            <a href="reset-password.html" class="auth-link">
                Забули пароль?
            </a>
        </form>

        <form id="registerForm" class="auth-form" hidden>

            <label for="registerName">
                Ім'я та прізвище
            </label>

            <input
                id="registerName"
                type="text"
                placeholder="Ваше ім'я"
                autocomplete="name"
                required
            >

            <label for="registerEmail">
                Email
            </label>

            <input
                id="registerEmail"
                type="email"
                placeholder="name@example.com"
                autocomplete="email"
                required
            >

            <label for="registerPassword">
                Пароль
            </label>

            <div class="password-field">
                <input
                    id="registerPassword"
                    type="password"
                    placeholder="Не менше 6 символів"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >

                <button
                    type="button"
                    class="password-toggle"
                    data-password-toggle="registerPassword"
                    aria-label="Показати пароль"
                >
                    👁
                </button>
            </div>

            <label for="registerRole">
                Роль
            </label>

            <select id="registerRole" required>
                <option value="" selected disabled>Оберіть роль</option>
                <option value="teacher">Вчитель</option>
                <option value="student">Учень</option>
                <option value="parent">Батьки</option>
            </select>

            <p class="form-hint">
                Після реєстрації акаунт очікує підтвердження адміністратора.
            </p>

            <button type="submit" class="primary-button" id="registerButton">
                Зареєструватися
            </button>
        </form>

        <div
            class="pending-panel"
            data-pending-user
            hidden
        >
            <div class="pending-icon">⏳</div>

            <h2>Очікується підтвердження</h2>

            <p>
                Ваша заявка на роль
                <strong data-pending-role>—</strong>
                очікує підтвердження адміністратора.
            </p>

            <p class="pending-email" data-pending-email></p>

            <button
                type="button"
                class="secondary-button"
                data-logout
            >
                Вийти
            </button>
        </div>

    </section>

    <footer class="auth-footer">
        <a href="index.html">← На головну</a>
        <span>© <span id="currentYear"></span> Ліцей №2</span>
    </footer>

</main>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const loginTab = document.getElementById('loginTab');
        const registerTab = document.getElementById('registerTab');
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const authTitle = document.getElementById('authTitle');
        const authSubtitle = document.getElementById('authSubtitle');
        const authMessage = document.getElementById('authMessage');

        function showMessage(message, type = 'error') {
            authMessage.textContent = message;
            authMessage.className = 'auth-message ' + type;
            authMessage.hidden = false;
        }

        function clearMessage() {
            authMessage.hidden = true;
            authMessage.textContent = '';
        }

        function switchMode(mode) {
            clearMessage();

            if (mode === 'register') {
                loginTab.classList.remove('active');
                registerTab.classList.add('active');

                loginForm.hidden = true;
                registerForm.hidden = false;

                authTitle.textContent = 'Реєстрація';
                authSubtitle.textContent = 'Створіть акаунт у системі ліцею.';
            } else {
                registerTab.classList.remove('active');
                loginTab.classList.add('active');

                registerForm.hidden = true;
                loginForm.hidden = false;

                authTitle.textContent = 'Вхід';
                authSubtitle.textContent = 'Увійдіть до цифрової системи ліцею.';
            }
        }

        loginTab.addEventListener('click', () => switchMode('login'));
        registerTab.addEventListener('click', () => switchMode('register'));

        document.querySelectorAll('[data-password-toggle]').forEach(button => {
            button.addEventListener('click', () => {
                const input = document.getElementById(
                    button.dataset.passwordToggle
                );

                if (!input) return;

                if (input.type === 'password') {
                    input.type = 'text';
                    button.textContent = '🙈';
                } else {
                    input.type = 'password';
                    button.textContent = '👁';
                }
            });
        });

        loginForm.addEventListener('submit', async event => {
            event.preventDefault();
            clearMessage();

            if (typeof supabaseClient === 'undefined') {
                showMessage('Система авторизації недоступна.');
                return;
            }

            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const button = document.getElementById('loginButton');

            button.disabled = true;
            button.textContent = 'Вхід...';

            try {
                const { data, error } =
                    await supabaseClient.auth.signInWithPassword({
                        email,
                        password
                    });

                if (error) throw error;

                if (!data?.user) {
                    throw new Error('Не вдалося отримати користувача.');
                }

                let profile = null;

                try {
                    const result = await supabaseClient
                        .from('profiles')
                        .select('id,full_name,role')
                        .eq('id', data.user.id)
                        .maybeSingle();

                    if (!result.error) {
                        profile = result.data;
                    }
                } catch (profileError) {
                    console.warn('Profile read error:', profileError);
                }

                if (!profile) {
                    showMessage(
                        'Акаунт знайдено, але профіль ще не створено. Зверніться до адміністратора.',
                        'warning'
                    );
                    button.disabled = false;
                    button.textContent = 'Увійти';
                    return;
                }

                if (typeof isPendingRole === 'function' &&
                    isPendingRole(profile.role)) {

                    const pendingName =
                        typeof getRequestedRoleName === 'function'
                            ? getRequestedRoleName(profile.role)
                            : 'обрану роль';

                    document.querySelectorAll('[data-pending-role]')
                        .forEach(element => {
                            element.textContent = pendingName;
                        });

                    document.querySelectorAll('[data-pending-email]')
                        .forEach(element => {
                            element.textContent =
                                data.user.email || email;
                        });

                    document.querySelector('[data-pending-user]').hidden = false;
                    loginForm.hidden = true;
                    registerForm.hidden = true;
                    document.querySelector('.auth-tabs').hidden = true;

                    authTitle.textContent = 'Очікується підтвердження';
                    authSubtitle.textContent =
                        'Адміністратор ще має підтвердити ваш акаунт.';

                    button.disabled = false;
                    button.textContent = 'Увійти';
                    return;
                }

                const role = profile.role;

                const destinations = {
                    admin: 'admin.html',
                    teacher: 'teacher.html',
                    student: 'student.html',
                    parent: 'parent.html'
                };

                location.href =
                    destinations[role] || 'dashboard.html';

            } catch (error) {
                console.error('Login error:', error);

                let message = 'Не вдалося виконати вхід.';

                if (error?.message) {
                    const text = error.message.toLowerCase();

                    if (
                        text.includes('invalid login') ||
                        text.includes('invalid credentials')
                    ) {
                        message = 'Неправильний email або пароль.';
                    } else if (
                        text.includes('email not confirmed')
                    ) {
                        message = 'Спочатку підтвердьте свою електронну пошту.';
                    } else {
                        message = error.message;
                    }
                }

                showMessage(message);
            }

            button.disabled = false;
            button.textContent = 'Увійти';
        });

        registerForm.addEventListener('submit', async event => {
            event.preventDefault();
            clearMessage();

            if (typeof supabaseClient === 'undefined') {
                showMessage('Система авторизації недоступна.');
                return;
            }

            if (
                typeof hasValidConsent === 'function' &&
                !hasValidConsent()
            ) {
                showMessage(
                    'Спочатку потрібно прийняти правила користування сайтом.'
                );

                setTimeout(() => {
                    location.href = 'consent.html';
                }, 900);

                return;
            }

            const fullName =
                document.getElementById('registerName').value.trim();

            const email =
                document.getElementById('registerEmail').value.trim();

            const password =
                document.getElementById('registerPassword').value;

            const selectedRole =
                document.getElementById('registerRole').value;

            const button =
                document.getElementById('registerButton');

            if (!selectedRole) {
                showMessage('Оберіть роль.');
                return;
            }

            button.disabled = true;
            button.textContent = 'Створення...';

            try {
                const redirectUrl =
                    'https://licei2.pntr.dev/verify-email.html';

                const { data, error } =
                    await supabaseClient.auth.signUp({
                        email,
                        password,
                        options: {
                            emailRedirectTo: redirectUrl,
                            data: {
                                full_name: fullName,
                                requested_role: selectedRole
                            }
                        }
                    });

                if (error) throw error;

                if (data?.user) {
                    try {
                        await supabaseClient
                            .from('profiles')
                            .upsert({
                                id: data.user.id,
                                full_name: fullName,
                                role: selectedRole + '_pending'
                            }, {
                                onConflict: 'id'
                            });
                    } catch (profileError) {
                        console.warn(
                            'Profile creation warning:',
                            profileError
                        );
                    }
                }

                showMessage(
                    'Реєстрацію створено. Перевірте email для підтвердження.',
                    'success'
                );

                registerForm.reset();

                setTimeout(() => {
                    switchMode('login');
                }, 1800);

            } catch (error) {
                console.error('Registration error:', error);

                let message = 'Не вдалося створити акаунт.';

                if (error?.message) {
                    message = error.message;
                }

                showMessage(message);
            }

            button.disabled = false;
            button.textContent = 'Зареєструватися';
        });
    });
</script>

</body>
</html>
